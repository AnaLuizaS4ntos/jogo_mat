<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Travessia — Crônicas do Prisma (Edição História Aprimorada)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --sky-top: #0f0c24;
      --sky-mid: #3d244c;
      --sky-low: #8c4b4a;
      --sun: #ffd98a;
      --dune-far: #63373e;
      --dune-mid: #472430;
      --dune-near: #2e1521;
      --stars: 0.65;
      --bg: #0f0c24;
      --ink: #fff8ed;
      --ink-soft: rgba(255, 248, 237, 0.82);
      --gold: #ffd98a;
      --teal: #8fe3d6;
      --rose: #ff9bb0;
      --panel: rgba(20, 12, 32, 0.88);
      --panel-border: rgba(255, 217, 138, 0.38);
      --veil: rgba(14, 8, 24, 0.78);
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: manipulation;
    }

    #world {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ================= BARRA DE TOPO E SELETOR DE CAPÍTULOS ================= */
    #top-nav {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      right: 14px;
      z-index: 8;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-pill {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
    }

    .nav-pill:hover {
      border-color: var(--gold);
      background: rgba(42, 26, 58, 0.92);
    }

    .nav-pill option {
      background: #1d1836;
      color: var(--ink);
    }

    /* ================= HUD DE EXPLORAÇÃO ================= */
    #hud {
      position: fixed;
      z-index: 5;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 14px;
      max-width: min(500px, calc(100vw - 180px));
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.4s, transform 0.4s;
    }

    #hud.on {
      opacity: 1;
      transform: none;
    }

    #hud .hud-quest {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    #hud .rule {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink);
    }

    #hud .line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
      font-size: 14.5px;
      color: var(--ink-soft);
    }

    #hud .line b {
      font-weight: 700;
      color: var(--gold);
    }

    #hud svg {
      display: block;
      filter: drop-shadow(0 0 4px rgba(255, 217, 138, 0.4));
    }

    /* Diário da Caravana no Capítulo 4 */
    #caravan-log {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 64px);
      right: 14px;
      z-index: 5;
      width: min(270px, 88vw);
      padding: 12px 15px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
      font-size: 13px;
      display: none;
    }

    #caravan-log.on {
      display: block;
    }

    #caravan-log h4 {
      margin: 0 0 6px 0;
      font-family: 'Cinzel', serif;
      font-size: 12px;
      color: var(--gold);
      letter-spacing: 0.06em;
    }

    #caravan-log ul {
      margin: 0;
      padding-left: 16px;
      line-height: 1.55;
      color: var(--ink-soft);
    }

    #caravan-log li.pending {
      opacity: 0.45;
      font-style: italic;
    }

    /* ================= AVISO RÁPIDO (TOAST) ================= */
    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
      transform: translate(-50%, 10px);
      z-index: 6;
      pointer-events: none;
      width: max-content;
      max-width: min(92vw, 560px);
      text-align: center;
      font-size: clamp(15px, 3.8vw, 17.5px);
      line-height: 1.45;
      padding: 12px 20px;
      border-radius: 14px;
      background: rgba(22, 13, 34, 0.92);
      border: 1px solid var(--panel-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.35s, transform 0.35s;
    }

    #toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #toast b {
      font-weight: 700;
      color: var(--gold);
    }

    /* ================= INTERFACE DOS SELOS / PUZZLES ================= */
    #ui {
      position: fixed;
      inset: 0;
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
      gap: 8px;
      background: radial-gradient(ellipse at 50% 45%, rgba(20, 12, 34, 0.82), rgba(10, 6, 20, 0.92));
      transition: opacity 0.6s ease;
    }

    #ui.off {
      opacity: 0;
      pointer-events: none;
    }

    #top {
      text-align: center;
      min-height: 54px;
    }

    #chapter {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: clamp(20px, 5vw, 28px);
      color: var(--gold);
      letter-spacing: 0.05em;
      line-height: 1.2;
    }

    #chapter span {
      font-size: 0.72em;
      color: var(--teal);
      margin-right: 0.5em;
      letter-spacing: 0.14em;
    }

    #subtitle {
      color: var(--ink-soft);
      font-size: clamp(14px, 3.5vw, 16.5px);
      margin-top: 4px;
    }

    #stage-wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stage {
      width: 100%;
      height: 100%;
      touch-action: none;
      overflow: visible;
    }

    #bottom {
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 14px 18px 16px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    #prompt {
      margin: 0 0 12px;
      font-size: clamp(15px, 3.8vw, 17.5px);
      line-height: 1.5;
      min-height: 1.5em;
    }

    #prompt b {
      font-weight: 700;
      color: var(--gold);
    }

    #prompt .eq {
      display: block;
      font-size: 16.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    #prompt .goal {
      display: block;
      font-size: 14.5px;
      color: var(--teal);
      margin-top: 4px;
    }

    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      min-height: 44px;
    }

    button {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.02em;
      color: var(--ink);
      background: rgba(255, 248, 237, 0.09);
      border: 1px solid rgba(255, 248, 237, 0.35);
      border-radius: 12px;
      padding: 10px 20px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, border-color 0.2s;
    }

    button:hover:not(:disabled) {
      background: rgba(255, 217, 138, 0.18);
      border-color: var(--gold);
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button.stone {
      min-width: 68px;
      font-size: 17px;
      font-weight: 700;
      padding: 11px 18px;
    }

    button.stone.right {
      border-color: #7dffb3;
      background: rgba(92, 216, 90, 0.28);
      color: #fff;
    }

    button.stone.wrong {
      border-color: var(--rose);
      background: rgba(255, 107, 139, 0.22);
      opacity: 0.6;
    }

    button.term {
      padding: 8px 13px;
      font-size: 14px;
      border-radius: 10px;
    }

    button.term.on {
      border-color: var(--gold);
      background: rgba(255, 217, 138, 0.25);
      color: var(--gold);
    }

    button.term small {
      display: block;
      font-size: 11px;
      opacity: 0.75;
    }

    button.walk {
      border-color: var(--gold);
      background: rgba(255, 217, 138, 0.2);
      color: var(--gold);
      padding: 12px 26px;
      font-weight: 700;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: min(300px, 78vw);
      height: 6px;
      border-radius: 4px;
      background: rgba(255, 248, 237, 0.22);
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold);
      cursor: pointer;
    }

    /* ================= PAINEL DE HISTÓRIA E DIÁLOGOS ================= */
    #narration {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 45%, rgba(22, 14, 38, 0.84), rgba(10, 6, 20, 0.94));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #narration.on {
      opacity: 1;
      pointer-events: auto;
    }

    .story-card {
      max-width: 600px;
      width: 94vw;
      background: rgba(28, 18, 44, 0.88);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 28px 26px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
    }

    #narration.title .story-card {
      background: rgba(24, 15, 38, 0.92);
      padding: 34px 28px;
    }

    .story-speaker {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--teal);
      background: rgba(143, 227, 214, 0.12);
      border: 1px solid rgba(143, 227, 214, 0.35);
      border-radius: 8px;
      padding: 4px 12px;
      margin-bottom: 14px;
    }

    #ntext {
      font-size: clamp(16.5px, 4.2vw, 20px);
      line-height: 1.6;
      color: var(--ink);
    }

    #ntext p {
      margin: 0.55em 0;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #ntext p.in {
      opacity: 1;
      transform: none;
    }

    #ntext em {
      color: var(--gold);
      font-style: normal;
      font-weight: 600;
    }

    #ntext small {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      color: var(--ink-soft);
    }

    #narration.title h1 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: clamp(36px, 10vw, 62px);
      color: var(--gold);
      letter-spacing: 0.12em;
      margin: 0 0 6px;
      line-height: 1.1;
      text-shadow: 0 4px 24px rgba(255, 217, 138, 0.35);
    }

    .f {
      display: inline-block;
      font-weight: 600;
      font-size: 0.85em;
      padding: 4px 12px;
      margin: 2px 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 217, 138, 0.55);
      color: var(--gold);
      background: rgba(255, 217, 138, 0.12);
    }

    #nbtn {
      margin-top: 22px;
      opacity: 0;
      transition: opacity 0.5s;
    }

    /* ================= ESTILOS DOS DIAGRAMAS SVG ================= */
    .glyph {
      transition: transform 0.9s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.8s ease;
    }

    .glyph.held {
      transition: opacity 0.4s ease;
    }

    .glyph.drag {
      cursor: grab;
    }

    .bob {
      animation: bob 4s ease-in-out infinite;
    }

    @keyframes bob {
      50% {
        transform: translateY(-4px);
      }
    }

    .ring {
      fill: url(#pool);
      stroke: var(--gold);
      stroke-opacity: 0.8;
      stroke-width: 2;
      stroke-dasharray: 5 5;
    }

    .ca {
      fill: rgba(255, 217, 138, 0.12);
      stroke: var(--gold);
      stroke-width: 2.2;
    }

    .cb {
      fill: rgba(143, 227, 214, 0.12);
      stroke: var(--teal);
      stroke-width: 2.2;
    }

    .cc {
      fill: rgba(255, 155, 176, 0.12);
      stroke: var(--rose);
      stroke-width: 2.2;
    }

    .univ {
      fill: rgba(18, 12, 30, 0.45);
      stroke: var(--ink);
      stroke-opacity: 0.45;
      stroke-dasharray: 4 6;
      stroke-width: 1.8;
    }

    /* Nomes dos conjuntos destacados na cor de cada conjunto e sem retângulos */
    .lbl-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 20px;
      paint-order: stroke;
      stroke: #120b1d;
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .lbl-sub {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      paint-order: stroke;
      stroke: #120b1d;
      stroke-width: 3.5px;
      stroke-linejoin: round;
    }

    .num {
      fill: var(--gold);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 17px;
      font-weight: 700;
      paint-order: stroke;
      stroke: #120b1d;
      stroke-width: 3.5px;
    }

    .mov,
    .dot {
      transition: transform 0.85s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .noanim .mov,
    .noanim .dot {
      transition: none;
    }

    .dot {
      mix-blend-mode: screen;
    }

    .da {
      fill: var(--gold);
    }

    .db {
      fill: var(--teal);
    }

    .badge circle {
      transition: fill 0.4s, stroke 0.4s;
      stroke-width: 1.8;
    }

    .badge text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .badge.zero circle {
      fill: rgba(255, 246, 232, 0.08);
      stroke: rgba(255, 246, 232, 0.35);
    }

    .badge.zero text {
      fill: var(--ink-soft);
    }

    .badge.ok circle {
      fill: rgba(255, 217, 138, 0.75);
      stroke: var(--gold);
    }

    .badge.ok text {
      fill: #2a1604;
    }

    .badge.over circle {
      fill: rgba(255, 155, 176, 0.45);
      stroke: var(--rose);
    }

    .badge.over text,
    .badge.neg text {
      fill: var(--ink);
    }

    .badge.neg circle {
      fill: rgba(143, 227, 214, 0.35);
      stroke: var(--teal);
    }

    @media (max-width: 600px) {
      #hud {
        max-width: calc(100vw - 28px);
        top: calc(env(safe-area-inset-top, 0px) + 56px);
      }
    }
  </style>
</head>

<body>

  <canvas id="world"
    aria-label="O Deserto de Solária. Toque ou Espaço para pular, segure no ar para planar, Setas A/D para guiar Lume."></canvas>

  <!-- Navegação Superior -->
  <nav id="top-nav">
    <select id="chapter-select" class="nav-pill" aria-label="Ir para Capítulo">
      <option value="0">Capítulos da História...</option>
      <option value="1">Cap. I — O Vale dos Fragmentos (|A|)</option>
      <option value="2">Cap. II — As Duas Guildas (A ∩ B)</option>
      <option value="3">Cap. III — A Ponte do Abismo (A ∪ B)</option>
      <option value="4">Cap. IV — A Caravana e o Prisma (3 Conj.)</option>
    </select>
    <button id="sound" class="nav-pill" aria-label="Som ligado/desligado">Som: ON</button>
  </nav>

  <div id="hud" aria-live="polite"></div>

  <aside id="caravan-log">
    <h4>Diário da Caravana (30 Viajantes)</h4>
    <ul id="caravan-list"></ul>
  </aside>

  <div id="toast" aria-live="polite"></div>

  <main id="ui" class="off">
    <header id="top">
      <div id="chapter"></div>
      <div id="subtitle"></div>
    </header>
    <section id="stage-wrap">
      <svg id="stage" viewBox="0 0 400 400" aria-label="Altar do Selo Matemático"></svg>
    </section>
    <footer id="bottom">
      <p id="prompt" aria-live="polite"></p>
      <div id="controls"></div>
    </footer>
  </main>

  <div id="narration" role="dialog" aria-live="polite">
    <div class="story-card">
      <div id="nspeaker" class="story-speaker">Crônicas de Solária</div>
      <div id="ntext"></div>
      <button id="nbtn" class="walk">Continuar ▶</button>
    </div>
  </div>

  <script>
    /* ================= UTILIDADES ================= */
    const $ = s => document.querySelector(s);
    const NS = 'http://www.w3.org/2000/svg', svg = $('#stage'), controls = $('#controls');
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const PI2 = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;

    function el(tag, attrs = {}, parent) {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }

    function txt(x, y, s, cls = 'lbl-title', color = '#fff8ed', parent = svg) {
      const t = el('text', { x, y, class: cls, 'text-anchor': 'middle', style: `fill:${color}` }, parent);
      t.textContent = s;
      return t;
    }

    function setLabel(x, y, title, sub = '', color = '#ffd98a', parent = svg) {
      const g = el('g', {}, parent);
      txt(x, y, title, 'lbl-title', color, g);
      if (sub) txt(x, y + 19, sub, 'lbl-sub', color, g);
      return g;
    }

    function pt(e) {
      const p = svg.createSVGPoint();
      p.x = e.clientX;
      p.y = e.clientY;
      return p.matrixTransform(svg.getScreenCTM().inverse());
    }

    const dist = (p, c) => Math.hypot(p.x - c.x, p.y - c.y);
    const setPrompt = h => { $('#prompt').innerHTML = h; };
    function setChapter(n, t, s) {
      $('#chapter').innerHTML = `<span>SELO ${n}</span>${t}`;
      $('#subtitle').textContent = s;
    }
    function showUI(on) {
      $('#ui').classList.toggle('off', !on);
      if (on) hud('');
    }
    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function hash(i) {
      const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
      return x - Math.floor(x);
    }
    function hud(h) {
      $('#hud').innerHTML = h;
      $('#hud').classList.toggle('on', !!h);
    }
    function toast(h, ms = 3000) {
      const t = $('#toast');
      t.innerHTML = h;
      t.classList.add('on');
      clearTimeout(toast.h);
      toast.h = setTimeout(() => t.classList.remove('on'), ms);
    }

    /* ================= ÁUDIO HARMONIOSO ================= */
    let AC = null, master = null, soundOn = true;
    function initAudio() {
      if (AC) {
        if (AC.state === 'suspended') AC.resume();
        return;
      }
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) { return; }
      master = AC.createGain();
      master.gain.value = soundOn ? 0.55 : 0;
      master.connect(AC.destination);
    }

    const SCALE = [220, 246.94, 293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25, 739.99, 880, 987.77];
    function chime(i = 5, vol = 1) {
      if (!AC) return;
      const t = AC.currentTime, f = SCALE[clamp(i | 0, 0, SCALE.length - 1)];
      [1, 2].forEach((m, k) => {
        const o = AC.createOscillator();
        o.type = k === 0 ? 'triangle' : 'sine';
        o.frequency.value = f * m;
        const g = AC.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.12 * vol / (k * 2 + 1), t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8 - k * 0.4);
        o.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + 1.9);
      });
    }

    function whoosh(vol = 1, freq = 420, dur = 0.3) {
      if (!AC) return;
      const t = AC.currentTime;
      const o = AC.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * 0.6, t);
      o.frequency.exponentialRampToValueAtTime(freq * 1.3, t + dur);
      const g = AC.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.06 * vol, t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(master);
      o.start(t);
      o.stop(t + dur + 0.02);
    }

    const soft = () => chime(0, 0.5);
    async function cascade() {
      for (const i of [4, 6, 8, 10]) {
        chime(i, 0.75);
        await sleep(140);
      }
    }

    $('#sound').onclick = () => {
      soundOn = !soundOn;
      $('#sound').textContent = soundOn ? 'Som: ON' : 'Som: OFF';
      initAudio();
      if (master) master.gain.value = soundOn ? 0.55 : 0;
    };

    /* ================= FRAGMENTOS DO PRISMA (FORMA + COR) ================= */
    const COL = { gold: '#ffd98a', rose: '#ff9bb0', teal: '#8fe3d6' };
    const SHAPE = {
      circle: ['orbe redondo', 'm'],
      triangle: ['pirâmide triangular', 'f'],
      diamond: ['cristal losango', 'm'],
      star: ['estrela solar', 'f']
    };
    const COLORNAME = {
      gold: ['dourado', 'dourada'],
      rose: ['rosado', 'rosada'],
      teal: ['verde-água', 'verde-água']
    };

    function describe(it) {
      const [n, g] = SHAPE[it.shape];
      return `${g === 'f' ? 'Uma' : 'Um'} ${n} ${COLORNAME[it.color][g === 'f' ? 1 : 0]}`;
    }

    function shapePath(s, r = 13) {
      if (s === 'circle') return `M ${r} 0 A ${r} ${r} 0 1 1 ${-r} 0 A ${r} ${r} 0 1 1 ${r} 0 Z`;
      if (s === 'triangle') return `M 0 ${-r} L ${r * 0.95} ${r * 0.75} L ${-r * 0.95} ${r * 0.75} Z`;
      if (s === 'diamond') return `M 0 ${-r * 1.1} L ${r * 0.78} 0 L 0 ${r * 1.1} L ${-r * 0.78} 0 Z`;
      let p = '';
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.46 : r * 1.08;
        p += (i ? 'L' : 'M') + (Math.cos(a) * rr).toFixed(1) + ' ' + (Math.sin(a) * rr).toFixed(1) + ' ';
      }
      return p + 'Z';
    }

    const PATHS = {};
    for (const s in SHAPE) PATHS[s] = new Path2D(shapePath(s, 10));
    const mk = (color, shape) => ({ color, shape, key: color + shape });
    const warm = it => it.color !== 'teal';
    const sharp = it => it.shape !== 'circle';

    function icon(it, sz = 22) {
      return `<svg viewBox="-16 -16 32 32" width="${sz}" height="${sz}">
    <path d="${shapePath(it.shape, 11)}" fill="${COL[it.color]}"/>
  </svg>`;
    }

    const G = s => {
      const m = {
        gc: ['gold', 'circle'], gt: ['gold', 'triangle'], gd: ['gold', 'diamond'], gs: ['gold', 'star'],
        rc: ['rose', 'circle'], rt: ['rose', 'triangle'], rd: ['rose', 'diamond'], rs: ['rose', 'star'],
        tc: ['teal', 'circle'], tt: ['teal', 'triangle'], td: ['teal', 'diamond'], ts: ['teal', 'star']
      }[s];
      return mk(m[0], m[1]);
    };

    /* ================= O MUNDO DE SOLÁRIA ================= */
    const cv = $('#world'), cx = cv.getContext('2d');
    let W, H, DPR, K, pal = {};
    const V = { s: 1, W: 0, H: 0 };
    let stars = [], sand = [];

    function readPal() {
      const cs = getComputedStyle(document.documentElement);
      ['sky-top', 'sky-mid', 'sky-low', 'sun', 'dune-far', 'dune-mid', 'dune-near', 'stars'].forEach(
        k => (pal[k] = cs.getPropertyValue('--' + k).trim())
      );
      pal.stars = parseFloat(pal.stars) || 0.35;
    }

    function resize() {
      DPR = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth;
      H = innerHeight;
      cv.width = W * DPR;
      cv.height = H * DPR;
      V.s = Math.min(H / 560, W / 400);
      V.W = W / V.s;
      V.H = H / V.s;
      K = DPR * V.s;
      readPal();
      stars = Array.from({ length: 130 }, () => ({
        x: Math.random() * V.W,
        y: Math.random() * V.H * 0.65,
        r: Math.random() * 1.4 + 0.4,
        p: Math.random() * 6
      }));
      sand = Array.from({ length: 55 }, () => ({
        x: Math.random() * V.W,
        y: V.H * (0.25 + Math.random() * 0.75),
        v: 0.35 + Math.random() * 0.8,
        r: Math.random() * 1.3 + 0.4
      }));
    }
    addEventListener('resize', resize);

    // Saturação que devolve as cores ao deserto conforme os Selos são restaurados
    let sat = 0.18, satTarget = 0.18;
    function hexRgb(h) {
      h = h.replace('#', '');
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const n = parseInt(h, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function tint(h, k = 1) {
      const [r, g, b] = hexRgb(h), l = 0.3 * r + 0.59 * g + 0.11 * b;
      const f = c => Math.round(clamp((l + (c - l) * sat) * k, 0, 255));
      return `rgb(${f(r)},${f(g)},${f(b)})`;
    }

    const sprites = {};
    function glowSprite(c) {
      if (sprites[c]) return sprites[c];
      const s = document.createElement('canvas');
      s.width = s.height = 64;
      const g = s.getContext('2d');
      const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      r.addColorStop(0, c);
      r.addColorStop(0.24, c + '88');
      r.addColorStop(1, c + '00');
      g.fillStyle = r;
      g.fillRect(0, 0, 64, 64);
      return (sprites[c] = s);
    }

    function glowAt(x, y, rad, c, a = 1) {
      if (a <= 0) return;
      cx.globalAlpha = a * 0.65;
      cx.drawImage(glowSprite(c), x - rad, y - rad, rad * 2, rad * 2);
      cx.globalAlpha = 1;
    }

    // Relevo das Dunas de Solária
    const PTS = [
      [-900, 400], [600, 392], [1400, 412], [2200, 382], [2900, 396],
      [3500, 410], [4300, 386], [5000, 406], [5700, 394], [6000, 392],
      [6600, 462], [7120, 520], [7200, 520], [7500, 520], [7580, 520],
      [8200, 470], [9000, 385], [9600, 305], [10040, 282], [12000, 282]
    ];
    const CHASM = [7200, 7500];

    function elev(x) {
      let i = 0;
      while (i < PTS.length - 2 && x >= PTS[i + 1][0]) i++;
      const [a, ay] = PTS[i], [b, by] = PTS[i + 1];
      const t = clamp((x - a) / (b - a), 0, 1), c = (1 - Math.cos(Math.PI * t)) / 2;
      return lerp(ay, by, c) + Math.sin(x * 0.013) * 3.5;
    }

    const bridge = { p: 0, done: false };
    function groundAt(x) {
      if (x > CHASM[0] && x < CHASM[1]) return bridge.done ? 520 : null;
      return elev(x);
    }

    const P = { x: 120, y: 400, vx: 0, vy: 0, ground: true, hold: false, jumpQ: false, charge: 1, glide: false, phase: 0, lastFoot: 0, scarf: [] };
    const R = { x: 300, y: 200, ph: 0 };
    const keys = { left: false, right: false };
    let camX = 0, camY = 0, mode = 'pause', T = 0, glow = 0, waiter = null, ctx = {};
    let glyphs = [], motes = [], ghosts = [], parts = [], feet = [], stones = [];

    function inGust(x) {
      return ghosts.some(gh => Math.abs(x - gh.x) < 42);
    }

    function updateCaravanLog() {
      const ul = $('#caravan-list');
      if (!ul) return;
      ul.innerHTML = ghosts.map((g, i) =>
        g.seen ? `<li>✔ ${g.short}</li>` : `<li class="pending">? Eco da Caravana #${i + 1}</li>`
      ).join('');
    }

    function resetWorld() {
      Object.assign(P, { x: 120, y: elev(120), vx: 0, vy: 0, ground: true, hold: false, jumpQ: false, charge: 1, glide: false, phase: 0, lastFoot: 0, scarf: [] });
      Object.assign(R, { x: P.x + 240, y: P.y - 220 });
      bridge.p = 0;
      bridge.done = false;
      sat = satTarget = 0.18;
      glow = 0;
      camX = P.x - V.W * 0.28;
      camY = P.y - V.H * 0.7;
      parts = [];
      feet = [];
      $('#caravan-log').classList.remove('on');

      const c1 = ['gc', 'tt', 'gc', 'rd', 'gs', 'tt', 'tc', 'rt', 'gs', 'gc', 'rt', 'tt', 'rd', 'tc'];
      const h1 = [22, 68, 114, 42, 98, 22, 122, 58, 30, 108, 50, 90, 22, 114];
      const c2 = ['gs', 'tc', 'rt', 'gc', 'gd', 'ts', 'rc', 'rs', 'td', 'gt', 'tc', 'rd', 'gc', 'gs', 'tt', 'rt'];
      const h2 = [40, 88, 58, 108, 30, 78, 50, 116, 40, 92, 58, 30, 108, 68, 45, 98];

      glyphs = [
        ...c1.map((k, i) => ({ it: G(k), x: 430 + i * 160, h: h1[i], ch: 1, alive: true, ph: Math.random() * 6 })),
        ...c2.map((k, i) => ({ it: G(k), x: 3200 + i * 135, h: h2[i], ch: 2, alive: true, ph: Math.random() * 6, drift: 20 }))
      ];

      motes = [];
      for (let x = 320; x < 9900; x += 210) {
        if (Math.abs(x - 2880) < 160 || Math.abs(x - 5660) < 160 || (x > 7050 && x < 7650)) continue;
        motes.push({ x, h: 55 + hash(x) * 100, alive: true });
      }

      const echoData = [
        { line: 'Eco #1: "Nossa Caravana partiu com <b>30 peregrinos</b> rumo ao Cume (<b>|U| = 30</b>)."', short: 'Total: |U| = 30 peregrinos' },
        { line: 'Eco #2: "Pelo caminho, <b>15</b> guiaram-se pela Areia (A), <b>12</b> pelo Vento (V) e <b>10</b> pela Estrela (E)."', short: '|A| = 15, |V| = 12, |E| = 10' },
        { line: 'Eco #3: "<b>5</b> peregrinos sentiram tanto a Areia quanto o Vento (<b>|A ∩ V| = 5</b>)."', short: 'Areia e Vento: |A ∩ V| = 5' },
        { line: 'Eco #4: "<b>4</b> seguiram o Vento e a Estrela (<b>|V ∩ E| = 4</b>), e <b>3</b> a Areia e a Estrela (<b>|A ∩ E| = 3</b>)."', short: '|V ∩ E| = 4 e |A ∩ E| = 3' },
        { line: 'Eco #5: "Apenas <b>2</b> anciãos dominaram os três caminhos juntos (<b>|A ∩ V ∩ E| = 2</b>)."', short: 'Os três juntos: |A ∩ V ∩ E| = 2' }
      ];

      ghosts = [7800, 8260, 8720, 9180, 9620].map((x, i) => ({
        x,
        line: echoData[i].line,
        short: echoData[i].short,
        seen: false,
        a: 1
      }));

      stones = [
        { x: 2880, lit: false },
        { x: 5660, lit: false },
        { x: 10080, lit: false, shrine: true }
      ];
    }

    /* ---------- ENTRADA: PULAR, PLANAR E GUIAR VELOCIDADE ---------- */
    function press() {
      initAudio();
      if (mode !== 'run') return;
      P.hold = true;
      if (P.ground) P.jumpQ = true;
    }
    function release() {
      P.hold = false;
    }
    cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
    addEventListener('pointerup', release);
    addEventListener('pointercancel', release);

    addEventListener('keydown', e => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
      if (e.repeat) return;
      if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) {
        e.preventDefault();
        press();
      }
    });

    addEventListener('keyup', e => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
      if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) release();
    });

    function burst(x, y, c, n = 14, sp = 2.4) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * PI2, v = Math.random() * sp + 0.4;
        parts.push({
          x, y,
          vx: Math.cos(a) * v,
          vy: Math.sin(a) * v - 0.6,
          life: 1,
          dec: 0.014 + Math.random() * 0.012,
          c,
          r: 5 + Math.random() * 6
        });
      }
    }

    function kick(x, y, n = 6) {
      for (let i = 0; i < n; i++) {
        parts.push({
          x: x + Math.random() * 10 - 5,
          y,
          vx: -Math.random() * 1.6 - 0.2,
          vy: -Math.random() * 1.4,
          life: 1,
          dec: 0.03,
          c: '#ffe2a8',
          r: 3 + Math.random() * 3,
          sand: true
        });
      }
    }

    let activeRunId = 0;
    function runUntil(x) {
      mode = 'run';
      return new Promise(res => {
        waiter = { x, res };
      });
    }

    function update(dt) {
      sat += (satTarget - sat) * 0.015 * dt;
      if (mode === 'ascend') {
        P.ground = false;
        P.glide = true;
        P.vy = lerp(P.vy, -1.6, 0.02 * dt);
        P.y += P.vy * dt;
        P.x += 0.35 * dt;
        glow = Math.min(1, glow + 0.0035 * dt);
        if (Math.random() < 0.5) {
          parts.push({
            x: P.x + Math.random() * 30 - 15,
            y: P.y - 40 + Math.random() * 30,
            vx: Math.random() - 0.5,
            vy: 0.6,
            life: 1,
            dec: 0.01,
            c: ['#ffd98a', '#8fe3d6', '#ff9bb0'][(Math.random() * 3) | 0],
            r: 4 + Math.random() * 5
          });
        }
      } else {
        const run = mode === 'run';
        const slope = (elev(P.x + 12) - elev(P.x - 12)) / 24;
        let baseSpeed = Math.max(1.65, 2.7 + clamp(slope * 9, -1, 2.8));
        if (keys.right) baseSpeed *= 1.35;
        if (keys.left) baseSpeed = -2.2;
        const target = run ? baseSpeed : 0;

        P.vx += (target - P.vx) * 0.06 * dt;
        P.x = Math.max(80, P.x + P.vx * dt);
        P.phase += Math.abs(P.vx) * 0.16 * dt;
        if (!bridge.done && P.x > CHASM[0] - 50) P.x = CHASM[0] - 50;

        const g = groundAt(P.x);
        if (P.ground) {
          if (g == null) P.ground = false;
          else P.y = g;
          if (P.jumpQ && run) {
            P.vy = -8.7;
            P.ground = false;
            whoosh(0.8, 700, 0.35);
            kick(P.x, P.y, 8);
          }
          P.charge = Math.min(1, P.charge + 0.0022 * dt);
          if (Math.abs(P.x - P.lastFoot) > 15) {
            P.lastFoot = P.x;
            feet.push({ x: P.x, y: P.y, a: 1, s: feet.length % 2 });
          }
          if (P.vx > 3.4 && Math.random() < 0.6) kick(P.x - 6, P.y, 1);
        }
        P.jumpQ = false;

        if (!P.ground) {
          P.vy += 0.34 * dt;
          const gust = inGust(P.x);
          P.glide = P.hold && (P.vy > -0.6 || gust) && (P.charge > 0 || gust);
          if (P.glide) {
            if (gust) {
              P.vy = Math.max(P.vy - 0.55 * dt, -4.2);
            } else {
              P.vy = Math.min(P.vy, 0.8);
              P.charge = Math.max(0, P.charge - 0.0038 * dt);
            }
            if (Math.random() < 0.55) {
              parts.push({
                x: P.x + 12,
                y: P.y - 34,
                vx: -0.6 - Math.random(),
                vy: Math.random() * 0.6 - 0.3,
                life: 1,
                dec: 0.028,
                c: '#82f26b',
                r: 3 + Math.random() * 3
              });
            }
          }
          P.y += P.vy * dt;
          if (g != null && P.y >= g && P.vy >= 0) {
            P.y = g;
            P.ground = true;
            P.vy = 0;
            kick(P.x, P.y, 5);
            whoosh(0.35, 300, 0.25);
          }
        }

        if (waiter && P.x >= waiter.x) {
          const w = waiter;
          waiter = null;
          mode = 'pause';
          w.res();
        }

        // Coleta de fragmentos e orbes
        for (const gl of glyphs) {
          if (!gl.alive) continue;
          const gy = glyphY(gl);
          if (Math.abs(gl.x - P.x) < 24 && Math.abs(gy - (P.y - 26)) < 34) {
            gl.alive = false;
            ctx.onPick && ctx.onPick(gl, gy);
          }
        }
        for (const m of motes) {
          if (!m.alive) continue;
          const my = elev(m.x) - m.h;
          if (Math.abs(m.x - P.x) < 22 && Math.abs(my - (P.y - 26)) < 32) {
            m.alive = false;
            P.charge = Math.min(1, P.charge + 0.45);
            burst(m.x, my, '#8fe3d6', 9, 1.5);
            chime(9 + ((Math.random() * 3) | 0), 0.3);
          }
        }
        for (const gh of ghosts) {
          if (!gh.seen && P.x > gh.x - 32 && mode === 'run') {
            gh.seen = true;
            toast(gh.line, 5200);
            chime(5, 0.65);
            burst(gh.x, elev(gh.x) - 24, '#8fe3d6', 18, 1.4);
            updateCaravanLog();
          }
        }
      }

      // Rastro fluido do cachecol mágico de Lume
      P.scarf.unshift({ x: P.x - 4, y: P.y - 28 });
      if (P.scarf.length > 10) P.scarf.pop();

      feet.forEach(f => (f.a -= 0.0016 * dt));
      feet = feet.filter(f => f.a > 0).slice(-140);
      parts.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += (p.sand ? 0.08 : -0.01) * dt;
        p.vx *= 0.99;
        p.life -= p.dec * dt;
      });
      parts = parts.filter(p => p.life > 0);

      // Íris: a arraia celeste que guia Lume pelo céu
      R.ph += 0.05 * dt;
      const tx = P.x + 140 + Math.sin(T * 0.008) * 70;
      const ty = P.y - 210 + Math.sin(T * 0.013) * 40 - (mode === 'ascend' ? 60 : 0);
      R.x += (tx - R.x) * 0.012 * dt;
      R.y += (ty - R.y) * 0.012 * dt;
      camX += ((P.x - V.W * 0.28) - camX) * 0.1 * dt;
      camY += ((P.y - V.H * 0.7) - camY) * 0.06 * dt;
    }

    const glyphY = gl => elev(gl.x) - gl.h + (gl.drift ? Math.sin(T * 0.03 + gl.ph) * gl.drift : Math.sin(T * 0.04 + gl.ph) * 4);

    /* ---------- RENDERIZAÇÃO ARTÍSTICA ---------- */
    function layer(p) {
      const cy0 = 400 - V.H * 0.7;
      cx.setTransform(K, 0, 0, K, -camX * p * K, -(cy0 + (camY - cy0) * p) * K);
    }

    function drawSparkleStar(x, y, arm, color) {
      cx.save();
      cx.fillStyle = color;
      cx.fillRect(x - arm, y - 0.6, arm * 2, 1.2);
      cx.fillRect(x - 0.6, y - arm, 1.2, arm * 2);
      cx.fillStyle = '#ffffff';
      cx.fillRect(x - 0.8, y - 0.8, 1.6, 1.6);
      cx.restore();
    }

    function drawLume(x, y, o = {}) {
      const glide = o.glide, ph = o.phase || 0, ghost = o.ghost, a = o.alpha ?? 1;

      // Cachecol vermelho esvoaçante (no personagem principal ou espectral no fantasma)
      if (!ghost && P.scarf.length > 2) {
        cx.save();
        cx.strokeStyle = '#e03e52';
        cx.lineWidth = 4;
        cx.lineCap = 'round';
        cx.beginPath();
        cx.moveTo(x - 2, y - 28);
        for (let i = 1; i < P.scarf.length; i++) {
          const sp = P.scarf[i];
          cx.lineTo(sp.x - i * 1.8, sp.y + Math.sin(T * 0.15 + i * 0.6) * 2.2);
        }
        cx.stroke();
        cx.restore();
      }

      cx.save();
      cx.translate(x, y);
      cx.globalAlpha = a;
      const sw = glide ? Math.sin(T * 0.2) * 1.5 : Math.sin(ph) * 2.2, fl = glide ? 8 : 0;
      const cloak = ghost ? 'rgba(140, 235, 255, 0.52)' : '#215794';
      const inner = ghost ? 'rgba(205, 250, 255, 0.6)' : '#c7d0eb';
      const hat = ghost ? 'rgba(120, 220, 250, 0.65)' : '#1a467a';

      if (!ghost) {
        cx.fillStyle = 'rgba(0,0,0,0.22)';
        cx.beginPath();
        cx.ellipse(2, 1, 13, 2.5, 0, 0, PI2);
        cx.fill();
      }

      // Capa de Mago / Guardião
      cx.fillStyle = cloak;
      cx.beginPath();
      cx.moveTo(-5, -30);
      cx.quadraticCurveTo(-10 - fl * 0.4, -13, -13 - fl + sw, 0);
      cx.quadraticCurveTo(0, glide ? -4 : 2, 13 + fl + sw * 0.5, 0);
      cx.quadraticCurveTo(10 + fl * 0.4, -13, 5, -30);
      cx.closePath();
      cx.fill();

      // Túnica clara interna
      cx.fillStyle = inner;
      cx.beginPath();
      cx.moveTo(-3, -27);
      cx.lineTo(-5 + sw * 0.4, 0);
      cx.lineTo(5 + sw * 0.4, 0);
      cx.lineTo(3, -27);
      cx.closePath();
      cx.fill();

      // Rosto e olhos verticais estilo Chibi Mago
      cx.fillStyle = ghost ? 'rgba(180, 245, 255, 0.75)' : '#df9e6e';
      cx.beginPath();
      cx.arc(0, -33, 5.5, 0, PI2);
      cx.fill();

      cx.fillStyle = '#1b1829';
      cx.fillRect(-0.5, -35, 1.4, 3.2);
      cx.fillRect(2.6, -35, 1.4, 3.2);

      // Gola do cachecol
      cx.fillStyle = ghost ? 'rgba(140, 240, 255, 0.7)' : '#d9323c';
      cx.fillRect(-5.5, -28.5, 11, 3.2);

      // Chapéu de Mago pontudo e curvado
      cx.fillStyle = hat;
      cx.beginPath();
      cx.moveTo(-16, -36);
      cx.quadraticCurveTo(0, -41.5, 16, -36);
      cx.quadraticCurveTo(0, -37.5, -16, -36);
      cx.fill();
      cx.beginPath();
      cx.moveTo(-9, -38);
      cx.quadraticCurveTo(-4, -52, -13, -50);
      cx.quadraticCurveTo(-1, -55, 9, -38);
      cx.closePath();
      cx.fill();

      // Cajado de madeira com gema esmeralda mágica na ponta
      const lx = glide ? 10 : 15;
      const ly = glide ? -44 : -30 + Math.sin(ph * 0.5) * 1.5;
      cx.strokeStyle = ghost ? 'rgba(140, 235, 255, 0.55)' : '#6e3f2d';
      cx.lineWidth = 2.2;
      cx.beginPath();
      cx.moveTo(-3, -10);
      cx.lineTo(lx, ly);
      cx.stroke();
      cx.restore();

      // Brilho mágico verde esmeralda na ponta do cajado
      const gemColor = ghost ? '#8fe3d6' : '#5cd85a';
      const pulse = Math.sin(T * 0.14);
      glowAt(x + lx, y + ly, 16 + pulse * 4 + P.charge * 10, gemColor, ghost ? 0.45 * a : 0.75);
      cx.fillStyle = ghost ? '#ccfaff' : '#82f26b';
      cx.beginPath();
      cx.arc(x + lx, y + ly, 3.2, 0, PI2);
      cx.fill();
      if (!ghost) {
        drawSparkleStar(x + lx, y + ly, 4 + pulse * 1.2, '#b8ffd6');
        for (let i = 0; i < 2; i++) {
          const ang = T * 0.08 + i * 3.14;
          drawSparkleStar(x + lx + Math.cos(ang) * 8, y + ly + Math.sin(ang) * 8, 2.2, '#82f26b');
        }
      }
    }

    function drawRay() {
      const f = Math.sin(R.ph), x = R.x, y = R.y;
      glowAt(x, y, 48, '#cfeff0', 0.38);
      cx.save();
      cx.translate(x, y);
      cx.rotate(Math.sin(R.ph * 0.5) * 0.08);
      cx.fillStyle = 'rgba(230,250,250,0.88)';
      cx.beginPath();
      cx.moveTo(22, 0);
      cx.quadraticCurveTo(6, -6 - f * 4, -4, -24 * (0.6 + 0.4 * f));
      cx.quadraticCurveTo(-6, -6, -14, 0);
      cx.quadraticCurveTo(-6, 6, -4, 24 * (0.6 + 0.4 * f));
      cx.quadraticCurveTo(6, 6 + f * 4, 22, 0);
      cx.fill();
      cx.strokeStyle = 'rgba(230,250,250,0.65)';
      cx.lineWidth = 1.5;
      cx.beginPath();
      cx.moveTo(-14, 0);
      for (let i = 1; i <= 10; i++) cx.lineTo(-14 - i * 5, Math.sin(R.ph * 1.2 - i * 0.6) * i * 0.7);
      cx.stroke();
      cx.restore();
    }

    function drawStone(s) {
      const gy = elev(s.x);
      if (s.shrine) {
        cx.fillStyle = tint(pal['dune-near'], 0.7);
        cx.fillRect(s.x - 46, gy - 120, 16, 120);
        cx.fillRect(s.x + 30, gy - 120, 16, 120);
        cx.fillRect(s.x - 56, gy - 132, 112, 14);
        cx.strokeStyle = s.lit ? '#ffd98a' : 'rgba(255,226,170,0.45)';
        cx.lineWidth = 2.2;
        cx.beginPath();
        cx.arc(s.x, gy - 70 + Math.sin(T * 0.03) * 4, 22, 0, PI2);
        cx.stroke();
        glowAt(s.x, gy - 70, s.lit ? 75 : 42, '#ffd98a', s.lit ? 0.85 : 0.4);
        return;
      }
      cx.fillStyle = tint(pal['dune-near'], 0.7);
      cx.beginPath();
      cx.moveTo(s.x - 16, gy + 4);
      cx.lineTo(s.x - 12, gy - 118);
      cx.lineTo(s.x + 3, gy - 128);
      cx.lineTo(s.x + 14, gy - 112);
      cx.lineTo(s.x + 17, gy + 4);
      cx.fill();
      const c = s.lit ? '#ffd98a' : 'rgba(255,226,170,0.45)';
      cx.strokeStyle = c;
      cx.lineWidth = 1.8;
      for (let i = 0; i < 4; i++) {
        cx.beginPath();
        cx.arc(s.x + 1, gy - 95 + i * 22, 5 + (i % 2) * 2, 0, PI2);
        cx.stroke();
      }
      if (s.lit) glowAt(s.x, gy - 60, 65, '#ffd98a', 0.55 + Math.sin(T * 0.05) * 0.15);
    }

    function render() {
      cx.setTransform(K, 0, 0, K, 0, 0);
      // Céu preenchendo 100% da altura da tela (sem risco de cortar ao subir)
      const g = cx.createLinearGradient(0, 0, 0, V.H);
      g.addColorStop(0, tint(pal['sky-top']));
      g.addColorStop(0.55, tint(pal['sky-mid']));
      g.addColorStop(1, tint(pal['sky-low']));
      cx.fillStyle = g;
      cx.fillRect(0, 0, V.W + 2, V.H + 2);

      if (pal.stars > 0) {
        cx.fillStyle = '#fff';
        for (const s of stars) {
          cx.globalAlpha = pal.stars * (0.45 + 0.55 * Math.sin(T * 0.02 + s.p)) * 0.85;
          cx.fillRect(s.x, s.y, s.r, s.r);
        }
        cx.globalAlpha = 1;
      }

      const hz = V.H * 0.6 - (camY - (400 - V.H * 0.7)) * 0.1;
      glowAt(V.W * 0.3, hz, Math.min(V.W, V.H) * (0.42 + glow * 0.4), '#ffe2a8', 0.55 + glow * 0.4);

      // Montanha do Prisma ao fundo com feixe de luz
      const prog = clamp(P.x / 10100, 0, 1), m = 0.55 + prog * 0.75, mx = V.W * 0.8, mb = hz + 60, mh = 165 * m;
      cx.fillStyle = tint(pal['dune-far'], 0.92);
      cx.globalAlpha = 0.85;
      cx.beginPath();
      cx.moveTo(mx - 240 * m, mb);
      cx.lineTo(mx - 14, mb - mh + 12);
      cx.lineTo(mx, mb - mh);
      cx.lineTo(mx + 16, mb - mh + 14);
      cx.lineTo(mx + 230 * m, mb);
      cx.fill();
      cx.globalAlpha = 1;

      const bw = 2 + glow * 10, bg = cx.createLinearGradient(0, 0, 0, mb - mh);
      bg.addColorStop(0, 'rgba(255,230,180,0)');
      bg.addColorStop(1, `rgba(255,230,180,${0.4 + 0.2 * Math.sin(T * 0.03) + glow * 0.5})`);
      cx.fillStyle = bg;
      cx.fillRect(mx - bw / 2, 0, bw, mb - mh);
      glowAt(mx, mb - mh, 12 + glow * 40, '#fff3cf', 0.9);

      // Ruínas distantes
      layer(0.35);
      cx.fillStyle = tint(pal['dune-far'], 0.82);
      const r0 = Math.floor((camX * 0.35) / 340) - 1;
      for (let i = r0; i < r0 + V.W / 340 + 3; i++) {
        const h = hash(i);
        if (h < 0.4) continue;
        const x = i * 340 + h * 120, ht = 50 + h * 110;
        cx.fillRect(x, 410 - ht, 13, ht + 400);
        if (h > 0.7) {
          cx.fillRect(x + 60, 410 - ht * 0.8, 13, ht * 0.8 + 400);
          cx.fillRect(x - 4, 410 - ht - 8, 21, 8);
          if (h > 0.85) cx.fillRect(x - 4, 410 - ht * 0.8 - 10, 82, 10);
        }
      }

      // Dunas médias
      layer(0.62);
      cx.fillStyle = tint(pal['dune-mid']);
      cx.beginPath();
      const x0 = camX * 0.62 - 20;
      cx.moveTo(x0, 2000);
      for (let x = x0; x <= x0 + V.W + 40; x += 10) {
        cx.lineTo(x, 438 + 20 * Math.sin(x * 0.004) + 9 * Math.sin(x * 0.011 + 2));
      }
      cx.lineTo(x0 + V.W + 40, 2000);
      cx.fill();

      // Camada Principal (Chão, Ponte, Ecos e Fragmentos)
      layer(1);
      const a = camX - 20, b = camX + V.W + 20, bot = camY + V.H + 300;
      const segs = bridge.done ? [[a, b]] : [[a, Math.min(b, CHASM[0])], [Math.max(a, CHASM[1]), b]];

      if (!bridge.done && b > CHASM[0] && a < CHASM[1]) {
        const cg = cx.createLinearGradient(0, 520, 0, 900);
        cg.addColorStop(0, tint(pal['dune-near'], 0.5));
        cg.addColorStop(1, 'rgba(0,0,0,0.92)');
        cx.fillStyle = cg;
        cx.fillRect(CHASM[0], 520, CHASM[1] - CHASM[0], bot);
      }

      for (const [s, e] of segs) {
        if (e <= s) continue;
        cx.fillStyle = tint(pal['dune-near']);
        cx.beginPath();
        cx.moveTo(s, bot);
        for (let x = s; x <= e; x += 6) {
          cx.lineTo(x, bridge.done && x > CHASM[0] && x < CHASM[1] ? 560 : elev(Math.min(x, e)));
        }
        cx.lineTo(e, elev(e));
        cx.lineTo(e, bot);
        cx.fill();

        cx.strokeStyle = 'rgba(255,226,170,0.28)';
        cx.lineWidth = 1.5;
        cx.beginPath();
        for (let x = s; x <= e; x += 6) {
          const y = elev(x);
          x === s ? cx.moveTo(x, y) : cx.lineTo(x, y);
        }
        cx.stroke();
      }

      if (bridge.p > 0) {
        const n = 14, w = (CHASM[1] - CHASM[0]) / n;
        for (let k = 0; k < n; k++) {
          if (k / n >= bridge.p) break;
          const px = CHASM[0] + k * w;
          cx.fillStyle = 'rgba(255,226,170,0.9)';
          cx.fillRect(px + 2, 519, w - 4, 6);
          glowAt(px + w / 2, 521, 24, '#ffd98a', 0.55);
        }
      }

      for (const f of feet) {
        cx.fillStyle = `rgba(40,15,10,${0.22 * f.a})`;
        cx.beginPath();
        cx.ellipse(f.x, f.y + (f.s ? 1.5 : -0.5), 3.6, 1.3, 0, 0, PI2);
        cx.fill();
      }

      stones.forEach(drawStone);

      // Ecos da Caravana com feixe de alma subindo até o topo e luzinhas azuis
      for (const gh of ghosts) {
        const gy = elev(gh.x);
        if (gh.seen) gh.a = Math.max(0.32, gh.a - 0.003);
        // Feixe fino espectral na alma do Eco indo até o topo infinito da tela
        cx.fillStyle = gh.seen ? 'rgba(143, 227, 214, 0.06)' : 'rgba(143, 227, 214, 0.13)';
        cx.fillRect(gh.x - 20, -1500, 40, gy + 1500);
        // Luzinhas azuis subindo na alma do Eco
        cx.fillStyle = '#8fe3d6';
        for (let k = 0; k < 6; k++) {
          const wx = gh.x - 14 + ((k * 11) % 28);
          const wy = gy - ((T * 3 + k * 75 + gh.x) % 520);
          cx.fillRect(wx, wy, 2.5, k % 2 === 0 ? 12 : 7);
        }
        glowAt(gh.x, gy - 26, 36, '#8fe3d6', 0.35 * gh.a);
        drawLume(gh.x, gy - (1 - gh.a) * 12 + Math.sin(T * 0.05 + gh.x) * 3, {
          ghost: true,
          alpha: (0.55 + Math.sin(T * 0.04 + gh.x) * 0.15) * gh.a,
          phase: 0
        });
      }

      for (const m of motes) {
        if (!m.alive) continue;
        const y = elev(m.x) - m.h + Math.sin(T * 0.05 + m.x) * 4;
        glowAt(m.x, y, 15, '#8fe3d6', 0.8);
        cx.fillStyle = '#fff';
        cx.beginPath();
        cx.arc(m.x, y, 2.2, 0, PI2);
        cx.fill();
      }

      // Fragmentos do caminho com brilho mágico e estrelinhas cintilantes
      for (const gl of glyphs) {
        if (!gl.alive) continue;
        const y = glyphY(gl), c = COL[gl.it.color];
        const pulse = Math.sin(T * 0.1 + gl.ph);
        glowAt(gl.x, y, 28 + pulse * 4, c, 0.8);
        cx.save();
        cx.translate(gl.x, y);
        cx.rotate(Math.sin(T * 0.02 + gl.ph) * 0.15);
        cx.fillStyle = c;
        cx.fill(PATHS[gl.it.shape]);
        cx.restore();
        for (let i = 0; i < 2; i++) {
          const ang = T * 0.06 + gl.ph + i * 3.14;
          drawSparkleStar(gl.x + Math.cos(ang) * 14, y + Math.sin(ang) * 14, 2.4, c);
        }
      }

      drawLume(P.x, P.y, { glide: P.glide && !P.ground, phase: P.phase });

      for (const p of parts) {
        if (p.sand) {
          cx.globalAlpha = p.life * 0.6;
          cx.fillStyle = '#f2d3a0';
          cx.fillRect(p.x, p.y, p.r * 0.6, p.r * 0.6);
          cx.globalAlpha = 1;
        } else {
          glowAt(p.x, p.y, p.r * p.life + 2, p.c, p.life);
        }
      }

      drawRay();

      // Primeiro plano: poeira dourada do deserto
      cx.setTransform(K, 0, 0, K, 0, 0);
      const gust = inGust(P.x) && mode === 'run';
      for (const s of sand) {
        s.x += (s.v + P.vx * 0.9) * (gust ? 2.0 : 1);
        s.y += Math.sin(T * 0.02 + s.x * 0.01) * 0.2;
        if (s.x > V.W + 10) {
          s.x = -10;
          s.y = V.H * (0.3 + Math.random() * 0.7);
        }
        cx.globalAlpha = (gust ? 0.5 : 0.22) + s.r * 0.12;
        cx.fillStyle = '#ffe6be';
        cx.fillRect(s.x, s.y, s.r * (gust ? 7 : 2.4), s.r * 0.7);
      }
      cx.globalAlpha = 1;
      if (glow > 0) {
        cx.fillStyle = `rgba(255,240,210,${glow * 0.55})`;
        cx.fillRect(0, 0, V.W, V.H);
      }
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(2.5, (now - last) / 16.67);
      last = now;
      T += dt;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    /* ================= NARRAÇÃO DE HISTÓRIA E CONTROLES ================= */
    async function narrate(lines, { title = false, speaker = 'Íris — Guia Celeste', btn = 'Continuar ▶' } = {}) {
      const n = $('#narration'), t = $('#ntext'), b = $('#nbtn'), sp = $('#nspeaker');
      hud('');
      n.classList.toggle('title', title);
      sp.textContent = speaker;
      t.innerHTML = '';
      b.textContent = btn;
      b.style.opacity = 0;
      b.disabled = true;
      n.classList.add('on');
      let hurry = false;
      n.onclick = e => { if (e.target !== b) hurry = true; };
      await sleep(300);
      for (const L of lines) {
        const p = document.createElement('p');
        p.innerHTML = L;
        t.appendChild(p);
        await sleep(35);
        p.classList.add('in');
        if (!hurry) await sleep(Math.min(1400, 450 + L.replace(/<[^>]+>/g, '').length * 12));
      }
      b.disabled = false;
      b.style.opacity = 1;
      b.focus({ preventScroll: true });
      await new Promise(res => {
        b.onclick = () => {
          initAudio();
          b.onclick = null;
          n.onclick = null;
          n.classList.remove('on');
          setTimeout(res, 550);
        };
      });
    }

    function walkButton(label = 'Seguir Jornada ▶') {
      return new Promise(res => {
        const b = document.createElement('button');
        b.className = 'walk';
        b.textContent = label;
        b.onclick = () => {
          controls.innerHTML = '';
          res();
        };
        controls.appendChild(b);
      });
    }

    function choose(opts, correct, hint) {
      return new Promise(res => {
        controls.innerHTML = '';
        opts.forEach(o => {
          const b = document.createElement('button');
          b.className = 'stone';
          b.textContent = o;
          b.onclick = () => {
            if (o === correct) {
              b.classList.add('right');
              cascade();
              setTimeout(() => {
                controls.innerHTML = '';
                res();
              }, 950);
            } else {
              b.classList.add('wrong');
              soft();
              setPrompt(hint);
            }
          };
          controls.appendChild(b);
        });
      });
    }

    function setupStage() {
      svg.innerHTML = '';
      const d = el('defs', {}, svg);
      const f = el('filter', { id: 'glow', x: '-100%', y: '-100%', width: '300%', height: '300%' }, d);
      el('feGaussianBlur', { stdDeviation: '3.2', result: 'b' }, f);
      const m = el('feMerge', {}, f);
      el('feMergeNode', { in: 'b' }, m);
      el('feMergeNode', { in: 'SourceGraphic' }, m);
      const rg = el('radialGradient', { id: 'pool' }, d);
      el('stop', { offset: '0%', 'stop-color': '#ffd98a', 'stop-opacity': '0.2' }, rg);
      el('stop', { offset: '100%', 'stop-color': '#ffd98a', 'stop-opacity': '0' }, rg);
    }

    function glyph(it, parent = svg) {
      const g = el('g', { class: 'glyph' }, parent), b = el('g', { class: 'bob' }, g);
      b.style.animationDelay = (-Math.random() * 4) + 's';
      el('circle', { r: 21, fill: COL[it.color], opacity: 0.15 }, b);
      el('path', { d: shapePath(it.shape), fill: COL[it.color], filter: 'url(#glow)' }, b);
      it.g = g;
      return g;
    }

    function place(g, x, y, s = 1) {
      g.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    }

    function bloom() {
      satTarget = Math.min(1, satTarget + 0.24);
      for (const c of Object.values(COL)) burst(P.x, P.y - 40, c, 14, 3);
      cascade();
    }

    /* ================= CAPÍTULO I — O VALE DOS FRAGMENTOS (CARDINALIDADE) ================= */
    async function chapter1() {
      await narrate([
        'Muitos anos atrás, a <em>Grande Tempestade Cinzenta</em> partiu o Prisma de Solária e roubou as cores do nosso deserto.',
        'Eu sou <em>Íris</em>, guardiã do céu, e você é <em>Lume</em>, o último Aprendiz do Farol.',
        'Para despertar o <em>Primeiro Monólito</em>, precisamos reunir os fragmentos espalhados nas dunas no conjunto <em>A</em>.'
      ], { speaker: 'Capítulo I — O Despertar de Lume' });

      const inA = {}, order = [];
      let touched = 0;
      const draw = () => hud(
        `<div class="hud-quest">Capítulo I • O Vale dos Fragmentos</div>` +
        `<div class="rule">Reúna as relíquias no conjunto da sua bolsa</div>` +
        `<div class="line">A = { ${order.map(k => icon(inA[k])).join('')} }</div>` +
        `<div class="line">Essências distintas <b>|A| = ${order.length}</b> &nbsp;•&nbsp; Fragmentos tocados: ${touched}</div>`
      );

      ctx = {
        onPick: (gl, gy) => {
          touched++;
          const it = gl.it, c = COL[it.color];
          P.charge = Math.min(1, P.charge + 0.25);
          if (inA[it.key]) {
            burst(gl.x, gy, c, 6, 1);
            chime(1, 0.5);
            toast(`${describe(it)} é um reflexo repetido — já está guardado em <b>A</b>!`, 2400);
          } else {
            inA[it.key] = it;
            order.push(it.key);
            burst(gl.x, gy, c, 18, 2.6);
            chime(4 + order.length, 0.9);
            toast(`Nova essência descoberta! ${describe(it)} entrou em <b>A</b> (<b>|A| = ${order.length}</b>).`, 2200);
          }
          draw();
        }
      };

      draw();
      toast('Toque ou aperte [Espaço / W] para pular • Segure no ar para planar • [A / D] controla o passo', 4500);
      await runUntil(2830);
      ctx = {};

      const n = order.length, t = touched;
      await narrate([
        `Lume, você tocou em <em>${t} fragmentos</em> pelo vale, mas o receptáculo <em>A</em> registrou <em>${n} essências únicas</em>.`,
        'O vento do deserto cria miragens e cópias idênticas, mas a magia antiga não se engana:',
        `<span class="f">|A| = ${n}</span>`,
        'A <em>Cardinalidade</em> de um conjunto conta apenas quantos <em>elementos distintos</em> ele possui. O que se repete conta uma única vez.'
      ], { speaker: 'Íris — Diante do Primeiro Monólito' });

      setChapter('I', 'O Monólito do Vale', 'Cardinalidade: contando apenas essências distintas');
      setupStage();
      const B = [G('gs'), G('gs'), G('tc'), G('rd'), G('tc'), G('gs'), G('rt'), G('td')];
      el('circle', { cx: 200, cy: 196, r: 158, class: 'ring' }, svg);
      setLabel(200, 74, 'B', 'Conjunto B (8 fragmentos no altar)', COL.gold, svg);
      shuffle(B).forEach((it, i) => {
        glyph(it);
        place(it.g, 95 + (i % 4) * 70, 152 + Math.floor(i / 4) * 76);
      });

      setPrompt('O altar do Monólito exibe 8 fragmentos brutos no conjunto <b>B</b>, mas alguns são idênticos. Qual é a cardinalidade <b>|B|</b>?');
      showUI(true);
      await choose([8, 5, 4, 6], 5, 'Observe os fragmentos repetidos: a estrela dourada (3x) e o orbe verde-água (2x) contam apenas uma vez cada!');
      setPrompt('<b>|B| = 5!</b> Oito fragmentos brutos, mas exatamente 5 essências distintas.');
      await walkButton('Despertar o Monólito ▶');
      showUI(false);
      stones[0].lit = true;
      bloom();
      await sleep(800);
    }

    /* ================= CAPÍTULO II — AS DUAS GUILDAS (INTERSEÇÃO + VENN) ================= */
    async function chapter2() {
      await narrate([
        'Olhe para o céu, Lume! O primeiro feixe de cor voltou às nuvens de Solária.',
        'Estamos entrando nas <em>Ruínas Gêmeas</em>, erguidas por duas antigas guildas de artesãos:',
        '<span class="f">Guilda A: Forja Solar (Tons Quentes — Dourado e Rosado)</span>',
        '<span class="f">Guilda B: Lapidários do Vento (Formas com Pontas)</span>',
        'Para abrir o Segundo Selo, seu cajado só pode absorver as relíquias criadas pelas <em>duas guildas ao mesmo tempo (A ∩ B)</em>!'
      ], { speaker: 'Capítulo II — As Ruínas Gêmeas' });

      let ok = 0;
      const got = [];
      const draw = () => hud(
        `<div class="hud-quest">Capítulo II • As Duas Guildas</div>` +
        `<div class="rule">Recolha apenas <em>A ∩ B</em>: Tom Quente <em>E</em> Com Pontas</div>` +
        `<div class="line">${got.map(it => icon(it)).join('')}</div>` +
        `<div class="line">Relíquias da aliança <b>|A ∩ B| coletadas: ${ok}</b></div>`
      );

      ctx = {
        onPick: (gl, gy) => {
          const it = gl.it, c = COL[it.color];
          if (warm(it) && sharp(it)) {
            ok++;
            got.push(it);
            burst(gl.x, gy, c, 18, 2.6);
            chime(5 + (ok % 6), 0.9);
            P.charge = Math.min(1, P.charge + 0.3);
            toast(`Relíquia da Aliança! ${describe(it)} pertence a <b>A ∩ B</b>.`, 1800);
          } else {
            burst(gl.x, gy, '#ffffff', 10, 3);
            soft();
            P.charge = Math.max(0, P.charge - 0.3);
            toast(`${describe(it)}: ${warm(it) ? 'é quente (A)' : 'é fria'} e ${sharp(it) ? 'tem pontas (B)' : 'é redonda'}. Não pertence à interseção <b>A ∩ B</b>!`, 2800);
          }
          draw();
        }
      };

      draw();
      await runUntil(5610);
      ctx = {};

      await narrate([
        'Chegamos ao <em>Mural das Duas Guildas</em>.',
        'Para destrancar o Segundo Selo, cada relíquia encontrada no santuário deve repousar em seu território exato dentro do universo <em>U</em>.'
      ], { speaker: 'Íris — O Mural das Guildas' });

      setChapter('II', 'O Mural das Duas Guildas', 'Diagrama de Venn: onde repousa cada relíquia?');
      setupStage();
      showUI(true);

      const A = { x: 144, y: 174, r: 98 }, Bc = { x: 256, y: 174, r: 98 }, U = { x: 12, y: 20, w: 376, h: 304 };
      el('rect', { x: U.x, y: U.y, width: U.w, height: U.h, rx: 22, class: 'univ' }, svg);
      setLabel(36, 48, 'U', '', '#fff8ed', svg);
      el('circle', { cx: A.x, cy: A.y, r: A.r, class: 'ca' }, svg);
      el('circle', { cx: Bc.x, cy: Bc.y, r: Bc.r, class: 'cb' }, svg);

      // Nomes dos conjuntos diretamente dentro dos círculos e na cor de cada conjunto
      setLabel(92, 102, 'A', 'Tons Quentes', COL.gold, svg);
      setLabel(308, 102, 'B', 'Com Pontas', COL.teal, svg);
      setLabel(200, 106, 'A ∩ B', 'msama', '#fff8ed', svg);

      const list = shuffle([G('gc'), G('rt'), G('ts'), G('tc'), G('gs'), G('rc'), G('td'), G('gd')]);
      const where = it => {
        const a = warm(it), b = sharp(it);
        return a && b
          ? 'pertence ao centro <b>A ∩ B</b>, onde os dois círculos se cruzam'
          : a
            ? 'pertence apenas ao círculo esquerdo <b>A</b> (quente, mas sem pontas)'
            : b
              ? 'pertence apenas ao círculo direito <b>B</b> (tem pontas, mas é frio)'
              : 'fica fora dos dois círculos, mas dentro da moldura de <b>U</b>';
      };

      for (const it of list) {
        await new Promise(res => {
          const g = glyph(it);
          g.classList.add('drag');
          g.style.opacity = 0;
          const home = { x: 200, y: 362 };
          place(g, home.x, home.y, 1.2);
          setTimeout(() => (g.style.opacity = 1), 50);
          setPrompt(`<b>${describe(it)}</b> — Arraste para o seu lugar no Mural das Guildas.`);
          let drag = false;
          g.addEventListener('pointerdown', e => {
            drag = true;
            g.setPointerCapture(e.pointerId);
            g.classList.add('held');
            initAudio();
          });
          g.addEventListener('pointermove', e => {
            if (!drag) return;
            const p = pt(e);
            place(g, p.x, p.y, 1.2);
          });
          const drop = e => {
            if (!drag) return;
            drag = false;
            g.classList.remove('held');
            const p = pt(e);
            const inU = p.x > U.x && p.x < U.x + U.w && p.y > U.y && p.y < U.y + U.h;
            const inA = dist(p, A) < A.r, inB = dist(p, Bc) < Bc.r;
            if (inU && inA === warm(it) && inB === sharp(it)) {
              place(g, p.x, p.y, 0.95);
              g.style.pointerEvents = 'none';
              chime(4 + ((Math.random() * 5) | 0), 0.9);
              res();
            } else {
              soft();
              place(g, home.x, home.y, 1.2);
              setPrompt(`${describe(it)}: ${warm(it) ? 'é' : 'não é'} de tom quente e ${sharp(it) ? 'tem' : 'não tem'} pontas. Ela ${where(it)}.`);
            }
          };
          g.addEventListener('pointerup', drop);
          g.addEventListener('pointercancel', drop);
        });
      }
      setPrompt('O Mural das Duas Guildas brilha em harmonia!');
      await sleep(1200);
      showUI(false);
      stones[1].lit = true;
      bloom();
    }

    /* ================= CAPÍTULO III — A PONTE DO ABISMO (UNIÃO DE 2 CONJUNTOS) ================= */
    function spiral(cx, cy, i, side = 1) {
      const r = 17 * Math.sqrt(i + 0.6), a = i * 2.4 + (side < 0 ? Math.PI : 0);
      return { x: cx + Math.cos(a) * r * 0.72, y: cy + 14 + Math.sin(a) * r * 0.78 };
    }

    function bridgeRound({ a, b, u, start }) {
      return new Promise(res => {
        setupStage();
        svg.classList.add('noanim');
        const cy = 182, Rr = 92, max = Math.min(a, b);
        const gA = el('g', { class: 'mov' }, svg), gB = el('g', { class: 'mov' }, svg);
        el('circle', { cx: 0, cy, r: Rr, class: 'ca' }, gA);
        el('circle', { cx: 0, cy, r: Rr, class: 'cb' }, gB);

        setLabel(-20, cy - Rr + 28, 'A', `|A| = ${a}`, COL.gold, gA);
        setLabel(20, cy - Rr + 28, 'B', `|B| = ${b}`, COL.teal, gB);
        setLabel(200, cy + Rr + 26, 'A ∩ B', '', '#fff8ed', svg);

        const dA = [...Array(a)].map(() => el('circle', { r: 5.5, class: 'dot da', filter: 'url(#glow)' }, svg));
        const dB = [...Array(b)].map(() => el('circle', { r: 5.5, class: 'dot db', filter: 'url(#glow)' }, svg));
        const lens = (j, k) => ({ x: 200, y: cy + 8 + (j - (k - 1) / 2) * 17 });

        controls.innerHTML = '';
        const s = document.createElement('input');
        s.type = 'range';
        s.min = 0;
        s.max = max;
        s.step = 1;
        s.value = start;
        s.setAttribute('aria-label', 'Aproximar os círculos');
        controls.appendChild(s);

        const nb = document.createElement('div');
        nb.style.width = '100%';
        controls.appendChild(nb);
        let solved = false;

        function upd(k) {
          const d = k === 0 ? 194 : 172 - k * 9, xA = 200 - d / 2, xB = 200 + d / 2;
          gA.style.transform = `translate(${xA}px,0)`;
          gB.style.transform = `translate(${xB}px,0)`;
          dA.forEach((c, i) => {
            const p = i < a - k ? spiral(xA - 32, cy, i, -1) : lens(i - (a - k), k);
            c.style.transform = `translate(${p.x}px,${p.y}px)`;
          });
          dB.forEach((c, i) => {
            const p = i < b - k ? spiral(xB + 32, cy, i, 1) : lens(i - (b - k), k);
            c.style.transform = `translate(${p.x}px,${p.y}px)`;
          });
          const sum = a + b - k;
          setPrompt(`<span class="eq">|A| + |B| − |A ∩ B| = ${a} + ${b} − <b>${k}</b> = <b>${sum}</b></span><span class="goal">A Ponte de Luz precisa de exatamente |A ∪ B| = ${u} pilares</span>`);
          if (sum === u && !solved) {
            solved = true;
            cascade();
            nb.innerHTML = '';
            const w = document.createElement('button');
            w.className = 'walk';
            w.textContent = 'Firmar Viga de Luz ▶';
            w.style.marginTop = '8px';
            w.onclick = () => {
              controls.innerHTML = '';
              svg.classList.remove('noanim');
              res();
            };
            nb.appendChild(w);
          } else if (sum !== u && solved) {
            solved = false;
            nb.innerHTML = '';
          }
        }
        s.oninput = () => {
          upd(+s.value);
          chime(2 + +s.value, 0.35);
        };
        upd(start);
        requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.remove('noanim')));
      });
    }

    async function chapter3() {
      await narrate([
        'À frente, o terreno mergulha rumo à <em>Fenda da Memória</em>, onde a antiga Ponte de Luz ruiu.',
        'Deslize pelas dunas, Lume! Recolha as centelhas brancas no caminho para manter seu cajado carregado.'
      ], { speaker: 'Capítulo III — A Descida para o Abismo' });

      hud(
        `<div class="hud-quest">Capítulo III • A Fenda da Memória</div>` +
        `<div class="rule">Deslize pelas dunas até a margem do Grande Abismo</div>` +
        `<div class="line">Toque para saltar e segure no ar para planar sobre o vento</div>`
      );
      await runUntil(CHASM[0] - 50);

      await narrate([
        'A Fenda da Memória corta a montanha ao meio.',
        'Para reconstruir a <em>Ponte de Luz</em>, precisamos unir os pilares solares (<em>A</em>) e os pilares celestes (<em>B</em>).',
        'Mas atenção: quando dois círculos compartilham elementos no centro (<em>A ∩ B</em>), esses pilares centrais são contados duas vezes se apenas somarmos!',
        '<span class="f">|A ∪ B| = |A| + |B| − |A ∩ B|</span>'
      ], { speaker: 'Íris — A Engenharia da Ponte' });

      setChapter('III', 'A Ponte da União', 'Descontando o que foi contado duas vezes');
      showUI(true);

      const rounds = [
        { a: 7, b: 5, u: 9, start: 0, s: 'Primeira Viga: una os círculos até restarem 9 pilares distintos' },
        { a: 6, b: 6, u: 8, start: 0, s: 'Segunda Viga: quantos pilares devem ser compartilhados na interseção?' },
        { a: 4, b: 5, u: 9, start: 4, s: 'Terceira Viga: e quando nenhum pilar é compartilhado (conjuntos disjuntos)?' }
      ];
      for (const r of rounds) {
        $('#subtitle').textContent = r.s;
        await bridgeRound(r);
        bridge.p = Math.min(0.99, bridge.p + 0.33);
        chime(7, 0.7);
      }

      setupStage();
      $('#subtitle').textContent = 'A Pedra Angular da Ponte';
      el('circle', { cx: 146, cy: 170, r: 94, class: 'ca' }, svg);
      el('circle', { cx: 254, cy: 170, r: 94, class: 'cb' }, svg);
      setLabel(96, 158, 'A', '|A| = 10', COL.gold, svg);
      setLabel(304, 158, 'B', '|B| = 8', COL.teal, svg);
      setLabel(200, 158, 'A ∩ B', '6 pilares', '#fff8ed', svg);
      setLabel(200, 312, '|A ∪ B| = ?', 'Total na União', COL.gold, svg);

      setPrompt('Para selar a última viga: se <b>|A| = 10</b>, <b>|B| = 8</b> e a interseção tem <b>|A ∩ B| = 6</b>, quantos pilares há na união <b>|A ∪ B|</b>?');
      await choose([18, 12, 24, 4], 12, 'Some |A| + |B| (10 + 8 = 18) e subtraia os 6 da interseção que foram contados duas vezes!');
      setPrompt('<b>10 + 8 − 6 = 12 pilares!</b> A Ponte de Luz está restaurada.');
      await walkButton('Atravessar o Abismo ▶');
      showUI(false);
      bridge.p = 1;
      bridge.done = true;
      bloom();

      await narrate([
        'A ponte está firme sob nossos pés!',
        'E quando dois conjuntos não têm nenhum elemento em comum, dizemos que são <em>disjuntos</em>:',
        '<span class="f">A ∩ B = ∅</span>',
        'Agora resta apenas a subida final para o Santuário do Prisma.'
      ], { speaker: 'Íris — Além da Fenda' });
    }

    /* ================= CAPÍTULO IV — OS ECOS DA CARAVANA E O PRISMA FINAL ================= */
    async function chapter4() {
      await narrate([
        'Esta é a encosta sagrada do <em>Monte Solária</em>.',
        'Antes da tempestade, uma caravana com <em>30 peregrinos</em> subiu esta montanha para proteger o Prisma.',
        'As almas luminosas deles permaneceram como <em>Ecos</em> na subida. Passe por cada Eco para registrar seus relatos no Diário e use o feixe azul de suas almas para planar até o topo!'
      ], { speaker: 'Capítulo IV — A Caravana dos Trinta' });

      $('#caravan-log').classList.add('on');
      updateCaravanLog();

      hud(
        `<div class="hud-quest">Capítulo IV • A Subida dos Ecos</div>` +
        `<div class="rule">Ouça os 5 Ecos da Caravana rumo ao Santuário do Cume</div>` +
        `<div class="line">No feixe azul de cada Eco, segure no ar para subir com o vento</div>`
      );
      await runUntil(10020);

      await narrate([
        'Alcançamos o <em>Santuário do Grande Prisma</em>!',
        'Os relatos dos 30 peregrinos contam quem seguiu os três caminhos sagrados:',
        '<span class="f">A: Areia (15)</span> <span class="f">V: Vento (12)</span> <span class="f">E: Estrela (10)</span>',
        'Para restaurar o Prisma, precisamos calcular quantos peregrinos viveram <em>pelo menos um</em> dos três caminhos (<b>|A ∪ V ∪ E|</b>).'
      ], { speaker: 'Íris — O Santuário do Cume' });

      setChapter('IV', 'Os Três Caminhos do Prisma', 'Princípio da Inclusão-Exclusão: cada região contada 1 única vez');
      setupStage();
      showUI(true);

      const C = [
        { x: 146, y: 144, c: 'ca', n: 'A', lx: 92, ly: 76, t: 'Areia (15)', col: COL.gold },
        { x: 254, y: 144, c: 'cb', n: 'V', lx: 308, ly: 76, t: 'Vento (12)', col: COL.teal },
        { x: 200, y: 236, c: 'cc', n: 'E', lx: 200, ly: 298, t: 'Estrela (10)', col: COL.rose }
      ];
      C.forEach(o => el('circle', { cx: o.x, cy: o.y, r: 92, class: o.c }, svg));
      C.forEach(o => setLabel(o.lx, o.ly, o.n, o.t, o.col, svg));

      const pos = {
        1: [106, 132],
        2: [294, 132],
        4: [200, 250],
        3: [200, 106],
        5: [148, 204],
        6: [252, 204],
        7: [200, 168]
      }, badges = {};

      for (const m in pos) {
        const g = el('g', { class: 'badge zero' }, svg);
        el('circle', { cx: pos[m][0], cy: pos[m][1], r: 15 }, g);
        const t = el('text', { x: pos[m][0], y: pos[m][1] }, g);
        t.textContent = '×0';
        badges[m] = { g, t };
      }

      const terms = [
        { m: 1, s: 1, l: '|A|', v: 15 },
        { m: 2, s: 1, l: '|V|', v: 12 },
        { m: 4, s: 1, l: '|E|', v: 10 },
        { m: 3, s: -1, l: '|A∩V|', v: 5 },
        { m: 6, s: -1, l: '|V∩E|', v: 4 },
        { m: 5, s: -1, l: '|A∩E|', v: 3 },
        { m: 7, s: 1, l: '|A∩V∩E|', v: 2 }
      ];

      controls.innerHTML = '';
      await new Promise(res => {
        function upd() {
          let all = true;
          for (const m in pos) {
            let k = 0;
            terms.forEach(t => { if (t.on && (m & t.m) === t.m) k += t.s; });
            const b = badges[m];
            b.t.textContent = '×' + k;
            b.g.setAttribute('class', 'badge ' + (k === 1 ? 'ok' : k === 0 ? 'zero' : k < 0 ? 'neg' : 'over'));
            if (k !== 1) all = false;
          }
          const on = terms.filter(t => t.on);
          let sum = 0, ex = '';
          on.forEach((t, i) => {
            sum += t.s * t.v;
            ex += (i === 0 ? (t.s < 0 ? '−' : '') : (t.s < 0 ? ' − ' : ' + ')) + t.v;
          });
          setPrompt(
            on.length
              ? `<span class="eq">${ex} = <b>${sum}</b></span><span class="goal">${all ? 'Equilíbrio perfeito! Cada região foi contada exatamente uma vez!' : 'Ative os termos até que todas as 7 regiões fiquem com ×1'}</span>`
              : 'Toque nos 7 termos abaixo para incluí-los e excluí-los até que cada região do diagrama marque <b>×1</b>.'
          );
          return all;
        }
        terms.forEach(t => {
          const b = document.createElement('button');
          b.className = 'term';
          b.innerHTML = `${t.s > 0 ? '+' : '−'} ${t.l}<small>${t.v}</small>`;
          b.onclick = () => {
            t.on = !t.on;
            b.classList.toggle('on', t.on);
            chime(t.s > 0 ? 6 : 3, 0.6);
            if (upd()) {
              controls.querySelectorAll('button').forEach(x => (x.disabled = true));
              cascade();
              setTimeout(res, 2000);
            }
          };
          controls.appendChild(b);
        });
        upd();
      });

      showUI(false);
      await narrate([
        'Quando somamos <em>|A| + |V| + |E|</em>, as interseções são contadas vezes demais.',
        'Quando subtraímos os três pares (<em>− |A∩V| − |V∩E| − |A∩E|</em>), acabamos retirando o centro totalmente.',
        'Ao devolver o centro (<em>+ |A∩V∩E|</em>), tudo entra em equilíbrio:',
        '<span class="f">|A ∪ V ∪ E| = 15 + 12 + 10 − 5 − 4 − 3 + 2 = 27</span>'
      ], { speaker: 'Íris — O Princípio da Inclusão-Exclusão' });

      setupStage();
      setChapter('IV', 'O Guardião do Portal Externo', 'O Conjunto Complementar: quem ficou fora da união?');
      showUI(true);
      el('rect', { x: 24, y: 40, width: 352, height: 260, rx: 24, class: 'univ' }, svg);
      setLabel(92, 68, 'U', '|U| = 30 peregrinos', '#fff8ed', svg);
      el('circle', { cx: 200, cy: 182, r: 92, class: 'ring' }, svg);
      setLabel(200, 174, 'A ∪ V ∪ E', '27 peregrinos', COL.gold, svg);
      setLabel(200, 336, 'Complementar = ?', 'Fora dos três caminhos', COL.teal, svg);

      setPrompt('A caravana tinha <b>|U| = 30</b> peregrinos no total, e <b>27</b> seguiram ao menos um dos três caminhos. Quantos permaneceram guardando o portal externo (não seguiram nenhum dos três)?');
      await choose([3, 27, 0, 57], 3, 'Subtraia a união do total do universo U: 30 − 27!');
      setPrompt('<b>30 − 27 = 3 peregrinos!</b> O conjunto complementar fecha o último Selo do Prisma.');
      await walkButton('Restaurar o Grande Prisma ★');
      showUI(false);
      $('#caravan-log').classList.remove('on');
      stones[2].lit = true;
      satTarget = 1;
      bloom();
    }

    /* ================= JORNADA COMPLETA E SELETOR DE CAPÍTULOS ================= */
    async function startFromChapter(startCh = 0) {
      const runId = ++activeRunId;
      waiter = null;
      ctx = {};
      showUI(false);
      hud('');
      resetWorld();
      mode = 'pause';

      if (startCh <= 1) {
        if (startCh === 0) {
          await narrate([
            '<h1>TRAVESSIA</h1>',
            '<em>Crônicas do Prisma de Solária</em>',
            'Uma aventura interativa pelos Conjuntos Matemáticos',
            '<small>Toque ou [Espaço / W] para pular • Segure no ar para planar • [Setas / A e D] para guiar Lume</small>'
          ], { title: true, speaker: 'Edição História Aprimorada', btn: 'Iniciar Travessia ▶' });
          if (runId !== activeRunId) return;
        }
        await chapter1();
        if (runId !== activeRunId) return;
      } else {
        stones[0].lit = true;
        sat = satTarget = 0.42;
      }

      if (startCh <= 2) {
        if (startCh === 2) {
          P.x = 2920;
          P.y = elev(P.x);
          camX = P.x - V.W * 0.28;
          camY = P.y - V.H * 0.7;
        }
        await chapter2();
        if (runId !== activeRunId) return;
      } else {
        stones[1].lit = true;
        sat = satTarget = 0.66;
      }

      if (startCh <= 3) {
        if (startCh === 3) {
          P.x = 5720;
          P.y = elev(P.x);
          camX = P.x - V.W * 0.28;
          camY = P.y - V.H * 0.7;
        }
        await chapter3();
        if (runId !== activeRunId) return;
      } else {
        bridge.p = 1;
        bridge.done = true;
        sat = satTarget = 0.84;
      }

      if (startCh === 4) {
        P.x = 7580;
        P.y = elev(P.x);
        camX = P.x - V.W * 0.28;
        camY = P.y - V.H * 0.7;
      }
      await chapter4();
      if (runId !== activeRunId) return;

      mode = 'ascend';
      whoosh(1, 400, 2.5);
      await sleep(4800);
      if (runId !== activeRunId) return;

      await narrate([
        'O <em>Grande Prisma de Solária</em> brilha novamente, e todas as cores voltaram ao deserto!',
        '<span class="f">|A| conta as essências distintas</span>',
        '<span class="f">A ∩ B revela a aliança do que é comum</span>',
        '<span class="f">|A ∪ B| une sem contar duas vezes</span>',
        'Obrigado por guiar Lume e Íris até o alto da montanha!'
      ], { speaker: 'Epílogo — O Deserto Restaurado', btn: 'Recomeçar a Travessia ↻' });

      startFromChapter(0);
    }

    $('#chapter-select').onchange = e => {
      const ch = parseInt(e.target.value, 10);
      e.target.value = '0';
      e.target.blur();
      initAudio();
      $('#narration').classList.remove('on');
      startFromChapter(ch);
    };

    resize();
    resetWorld();
    requestAnimationFrame(frame);
    startFromChapter(0);
  </script>
</body>

</html>
