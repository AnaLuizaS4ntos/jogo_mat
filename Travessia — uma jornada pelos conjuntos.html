<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travessia — uma jornada pelos conjuntos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky-top:#2e2350; --sky-mid:#b5577a; --sky-low:#f0a866; --sun:#ffe2a8;
  --dune-far:#c97b57; --dune-mid:#a95e3c; --dune-near:#8a4528; --stars:.25;
  --bg:#2e2350;
  --ink:#fff6e8; --ink-soft:rgba(255,246,232,.74);
  --gold:#ffd98a; --teal:#8fe3d6; --rose:#ff9bb0;
  --panel:rgba(48,20,40,.4); --veil:rgba(30,10,30,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky-top:#05071a; --sky-mid:#161c46; --sky-low:#4b3460; --sun:#f3dcae;
    --dune-far:#2b2850; --dune-mid:#201d3d; --dune-near:#15122b; --stars:1;
    --bg:#05071a; --panel:rgba(12,10,34,.55); --veil:rgba(4,4,18,.55);
  }
}
:root[data-theme="dark"]{
  --sky-top:#05071a; --sky-mid:#161c46; --sky-low:#4b3460; --sun:#f3dcae;
  --dune-far:#2b2850; --dune-mid:#201d3d; --dune-near:#15122b; --stars:1;
  --bg:#05071a; --panel:rgba(12,10,34,.55); --veil:rgba(4,4,18,.55);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);overflow:hidden;color:var(--ink);
  font-family:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:300;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);right:64px;pointer-events:none;z-index:2;
  opacity:0;transition:opacity .8s;text-shadow:0 1px 10px rgba(0,0,0,.45)}
#hud.on{opacity:1}
#hud .rule{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px;line-height:1.25}
#hud .line{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:15px}
#hud .line b{font-weight:500;color:var(--gold)}
#hud svg{display:block}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,10px);z-index:3;pointer-events:none;
  width:min(92vw,460px);text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(18px,4.6vw,22px);line-height:1.35;
  padding:12px 18px;border-radius:20px;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transition:opacity .7s,transform .7s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{font-family:'Jost',sans-serif;font-weight:500;font-size:.82em;color:var(--gold)}

#ui{position:fixed;inset:0;z-index:4;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 12px);gap:6px;
  background:radial-gradient(ellipse at 50% 45%,var(--veil),transparent 80%);
  transition:opacity 1s ease;text-shadow:0 1px 14px rgba(0,0,0,.35)}
#ui.off{opacity:0;pointer-events:none}
#top{text-align:center;min-height:58px}
#chapter{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(24px,6vw,34px);letter-spacing:.03em;line-height:1.1}
#chapter span{font-size:.62em;opacity:.6;margin-right:.5em;letter-spacing:.18em}
#subtitle{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:var(--ink-soft);font-size:clamp(16px,4vw,20px);margin-top:2px}
#stage-wrap{flex:1;min-height:0;width:100%;max-width:520px;display:flex;align-items:center;justify-content:center}
#stage{width:100%;height:100%;touch-action:none;overflow:visible}
#bottom{width:100%;max-width:520px;box-sizing:border-box;text-align:center;padding:12px 14px 14px;border-radius:22px;
  background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#prompt{margin:0;font-size:15.5px;line-height:1.5;min-height:1.5em}
#prompt b{font-weight:500;color:var(--gold)}
#prompt .eq{display:block;font-size:17px;margin:2px 0}
#prompt .goal{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:18px;color:var(--ink-soft)}
#controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
#controls:empty{display:none}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.stone{min-width:54px;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,246,232,.35);
  background:rgba(255,246,232,.06);font-size:18px;font-weight:400;transition:background .4s,border-color .4s,opacity .4s}
.stone:hover{background:rgba(255,246,232,.14)}
.stone.right{border-color:var(--gold);background:rgba(255,217,138,.25)}
.stone.wrong{opacity:.35}
.walk{padding:10px 22px;border-radius:999px;border:1px solid var(--gold);background:rgba(255,217,138,.14);
  font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px}
.term{padding:8px 11px;border-radius:14px;border:1px solid rgba(255,246,232,.3);background:rgba(255,246,232,.05);font-size:14.5px;line-height:1.2}
.term small{display:block;opacity:.65;font-size:12px}
.term.on{border-color:var(--gold);background:rgba(255,217,138,.22)}
input[type=range]{width:min(320px,86%);accent-color:var(--gold);height:30px}

#narration{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 28px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:radial-gradient(ellipse at 50% 45%,var(--veil),transparent 75%);
  opacity:0;pointer-events:none;transition:opacity .9s ease;text-align:center;text-shadow:0 1px 18px rgba(0,0,0,.45)}
#narration.on{opacity:1;pointer-events:auto}
#ntext{max-width:30ch;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(21px,5.4vw,27px);line-height:1.42}
#ntext p{margin:.4em 0;opacity:0;transform:translateY(8px);transition:opacity 1.3s ease,transform 1.3s ease}
#ntext p.in{opacity:1;transform:none}
#ntext em{color:var(--ink-soft)}
#ntext small{font-family:'Jost',sans-serif;font-size:14px;letter-spacing:.03em;color:var(--ink-soft)}
#narration.title h1{font-weight:400;font-size:clamp(52px,15vw,88px);letter-spacing:.14em;margin:0 0 .1em;line-height:1}
.f{display:inline-block;font-family:'Jost',sans-serif;font-weight:400;font-size:.74em;padding:.35em .9em;border-radius:999px;
  border:1px solid rgba(255,217,138,.55);color:var(--gold);background:rgba(255,217,138,.07);white-space:nowrap}
#nbtn{margin-top:26px;opacity:0;transition:opacity .8s}
#sound{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,246,232,.3);background:rgba(0,0,0,.14);font-size:17px}
#sound.muted{opacity:.4;text-decoration:line-through}

.glyph{transition:transform 1.15s cubic-bezier(.25,.8,.25,1),opacity 1s ease}
.glyph.held{transition:opacity 1s ease}
.glyph.drag{cursor:grab}
.bob{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.ring{fill:url(#pool);stroke:var(--gold);stroke-opacity:.75;stroke-width:1.4;stroke-dasharray:3 6}
.ca{fill:rgba(255,217,138,.09);stroke:var(--gold);stroke-width:1.5}
.cb{fill:rgba(143,227,214,.09);stroke:var(--teal);stroke-width:1.5}
.cc{fill:rgba(255,155,176,.09);stroke:var(--rose);stroke-width:1.5}
.univ{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-dasharray:2 7;stroke-width:1.2}
.lbl{fill:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:20px}
.lbl.s{font-size:15px;fill:var(--ink-soft)}
.num{fill:var(--ink);font-family:'Jost',sans-serif;font-size:17px;font-weight:400}
.mov,.dot{transition:transform 1s cubic-bezier(.25,.8,.25,1)}
.noanim .mov,.noanim .dot{transition:none}
.dot{mix-blend-mode:screen}
.da{fill:var(--gold)} .db{fill:var(--teal)}
.badge circle{transition:fill .6s,stroke .6s}
.badge text{font-family:'Jost',sans-serif;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central}
.badge.zero circle{fill:rgba(255,246,232,.04);stroke:rgba(255,246,232,.25)}
.badge.zero text{fill:var(--ink-soft)}
.badge.ok circle{fill:rgba(255,217,138,.55);stroke:var(--gold)}
.badge.ok text{fill:#3a2208}
.badge.over circle{fill:rgba(255,155,176,.35);stroke:var(--rose)}
.badge.over text,.badge.neg text{fill:var(--ink)}
.badge.neg circle{fill:rgba(143,227,214,.25);stroke:var(--teal)}
@media (prefers-reduced-motion:reduce){.bob{animation:none}.glyph,.mov,.dot{transition-duration:.01s}}
</style>
</head>
<body>
<canvas id="world" aria-label="O deserto. Toque para pular, segure no ar para planar."></canvas>
<div id="hud" aria-live="polite"></div>
<div id="toast" aria-live="polite"></div>
<main id="ui" class="off">
  <header id="top"><div id="chapter"></div><div id="subtitle"></div></header>
  <section id="stage-wrap"><svg id="stage" viewBox="0 0 400 400" aria-label="Área do enigma"></svg></section>
  <footer id="bottom"><p id="prompt" aria-live="polite"></p><div id="controls"></div></footer>
</main>
<div id="narration" role="dialog" aria-live="polite"><div id="ntext"></div><button id="nbtn" class="walk">continuar</button></div>
<button id="sound" aria-label="Som ligado/desligado">♪</button>

<script>
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg',svg=$('#stage'),controls=$('#controls');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const PI2=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function txt(x,y,s,cls='lbl',parent=svg){const t=el('text',{x,y,class:cls,'text-anchor':'middle'},parent);t.textContent=s;return t}
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
const dist=(p,c)=>Math.hypot(p.x-c.x,p.y-c.y);
const setPrompt=h=>{$('#prompt').innerHTML=h};
function setChapter(n,t,s){$('#chapter').innerHTML=`<span>${n}</span>${t}`;$('#subtitle').textContent=s}
function showUI(on){$('#ui').classList.toggle('off',!on);if(on)hud('')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hash(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function hud(h){$('#hud').innerHTML=h;$('#hud').classList.toggle('on',!!h)}
function toast(h,ms=2800){const t=$('#toast');t.innerHTML=h;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms)}

/* ================= som ================= */
let AC=null,master=null,noiseBuf=null,soundOn=true;
function initAudio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=soundOn?.6:0;master.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;const dg=AC.createGain();dg.gain.value=.05;lp.connect(dg);dg.connect(master);
  [110,164.8,220.4].forEach((f,i)=>{const o=AC.createOscillator();o.type=i===2?'triangle':'sine';o.frequency.value=f;
    const g=AC.createGain();g.gain.value=i===2?.12:.38;o.connect(g);g.connect(lp);o.start();
    const l=AC.createOscillator();l.frequency.value=.05+i*.031;const lg=AC.createGain();lg.gain.value=.14;l.connect(lg);lg.connect(g.gain);l.start()});
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const n=AC.createBufferSource();n.buffer=noiseBuf;n.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=520;bp.Q.value=.7;
  const wg=AC.createGain();wg.gain.value=.022;n.connect(bp);bp.connect(wg);wg.connect(master);n.start();
  const l=AC.createOscillator();l.frequency.value=.07;const lg=AC.createGain();lg.gain.value=280;l.connect(lg);lg.connect(bp.frequency);l.start();
}
const SCALE=[196,220,261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880];
function chime(i=5,vol=1){if(!AC)return;const t=AC.currentTime,f=SCALE[clamp(i|0,0,SCALE.length-1)];
  [1,2.005,3.01].forEach((m,k)=>{const o=AC.createOscillator();o.frequency.value=f*m;const g=AC.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11*vol/(k*1.8+1),t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+2.6-k*.5);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+2.7)})}
function whoosh(vol=1,freq=900,dur=.45){if(!AC||!noiseBuf)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(freq,t);bp.frequency.exponentialRampToValueAtTime(freq*2,t+dur);bp.Q.value=1.2;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07*vol,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp);bp.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+.05)}
const soft=()=>chime(0,.55);
async function cascade(){for(const i of [5,7,9,11]){chime(i,.8);await sleep(160)}}
$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').classList.toggle('muted',!soundOn);initAudio();if(master)master.gain.value=soundOn?.6:0};

/* ================= glifos (forma + cor) ================= */
const COL={gold:'#ffd98a',rose:'#ff9bb0',teal:'#8fe3d6'};
const SHAPE={circle:['círculo','m'],triangle:['triângulo','m'],diamond:['losango','m'],star:['estrela','f']};
const COLORNAME={gold:['dourado','dourada'],rose:['rosado','rosada'],teal:['verde-água','verde-água']};
function describe(it){const [n,g]=SHAPE[it.shape];return `${g==='f'?'Uma':'Um'} ${n} ${COLORNAME[it.color][g==='f'?1:0]}`}
function shapePath(s,r=13){
  if(s==='circle')return `M ${r} 0 A ${r} ${r} 0 1 1 ${-r} 0 A ${r} ${r} 0 1 1 ${r} 0 Z`;
  if(s==='triangle')return `M 0 ${-r} L ${r*.95} ${r*.72} L ${-r*.95} ${r*.72} Z`;
  if(s==='diamond')return `M 0 ${-r*1.05} L ${r*.75} 0 L 0 ${r*1.05} L ${-r*.75} 0 Z`;
  let p='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.46:r*1.05;p+=(i?'L':'M')+(Math.cos(a)*rr).toFixed(1)+' '+(Math.sin(a)*rr).toFixed(1)+' '}return p+'Z'}
const PATHS={};for(const s in SHAPE)PATHS[s]=new Path2D(shapePath(s,10));
const mk=(color,shape)=>({color,shape,key:color+shape});
const warm=it=>it.color!=='teal',sharp=it=>it.shape!=='circle';
function icon(it,sz=20){return `<svg viewBox="-16 -16 32 32" width="${sz}" height="${sz}"><path d="${shapePath(it.shape,11)}" fill="${COL[it.color]}"/></svg>`}
const G=s=>{const m={gc:['gold','circle'],gt:['gold','triangle'],gd:['gold','diamond'],gs:['gold','star'],rc:['rose','circle'],rt:['rose','triangle'],rd:['rose','diamond'],rs:['rose','star'],tc:['teal','circle'],tt:['teal','triangle'],td:['teal','diamond'],ts:['teal','star']}[s];return mk(m[0],m[1])};

/* ================= o mundo ================= */
const cv=$('#world'),cx=cv.getContext('2d');
let W,H,DPR,K,pal={};const V={s:1,W:0,H:0};
let stars=[],sand=[];
function readPal(){const cs=getComputedStyle(document.documentElement);
  ['sky-top','sky-mid','sky-low','sun','dune-far','dune-mid','dune-near','stars'].forEach(k=>pal[k]=cs.getPropertyValue('--'+k).trim());pal.stars=parseFloat(pal.stars)||0}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  V.s=Math.min(H/560,W/400);V.W=W/V.s;V.H=H/V.s;K=DPR*V.s;readPal();
  stars=Array.from({length:120},()=>({x:Math.random()*V.W,y:Math.random()*V.H*.6,r:Math.random()*1.2+.3,p:Math.random()*6}));
  sand=Array.from({length:60},()=>({x:Math.random()*V.W,y:V.H*(.3+Math.random()*.7),v:.3+Math.random()*.8,r:Math.random()*1.3+.4}))}
addEventListener('resize',resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',readPal);

// cor que volta ao mundo, capítulo a capítulo
let sat=.12,satTarget=.12;
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function tint(h,k=1){const[r,g,b]=hexRgb(h),l=.3*r+.59*g+.11*b;const f=c=>Math.round(clamp((l+(c-l)*sat)*k,0,255));return`rgb(${f(r)},${f(g)},${f(b)})`}

const sprites={};
function glowSprite(c){if(sprites[c])return sprites[c];const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,c);r.addColorStop(.22,c+'99');r.addColorStop(1,c+'00');g.fillStyle=r;g.fillRect(0,0,64,64);return sprites[c]=s}
function glowAt(x,y,rad,c,a=1){if(a<=0)return;cx.globalAlpha=a;cx.drawImage(glowSprite(c),x-rad,y-rad,rad*2,rad*2);cx.globalAlpha=1}

// relevo: dunas, descida para o abismo, subida para o cume
const PTS=[[-900,400],[600,392],[1400,412],[2200,382],[2900,396],[3500,410],[4300,386],[5000,406],[5700,394],[6000,392],[6600,462],[7120,520],[7200,520],[7500,520],[7580,520],[8200,470],[9000,385],[9600,305],[10040,282],[12000,282]];
const CHASM=[7200,7500];
function elev(x){let i=0;while(i<PTS.length-2&&x>=PTS[i+1][0])i++;const[a,ay]=PTS[i],[b,by]=PTS[i+1];
  const t=clamp((x-a)/(b-a),0,1),c=(1-Math.cos(Math.PI*t))/2;return lerp(ay,by,c)+Math.sin(x*.013)*3.5}
const bridge={p:0,done:false};
function groundAt(x){if(x>CHASM[0]&&x<CHASM[1])return bridge.done?520:null;return elev(x)}

const P={x:120,y:400,vx:0,vy:0,ground:true,hold:false,jumpQ:false,charge:1,glide:false,phase:0,lastFoot:0};
const R={x:300,y:200,ph:0};
let camX=0,camY=0,mode='pause',T=0,glow=0,waiter=null,ctx={};
let glyphs=[],motes=[],ghosts=[],parts=[],feet=[],stones=[];
const GUSTS=[[7900,8180],[8480,8760],[9080,9380]];
const inGust=x=>GUSTS.some(([a,b])=>x>a&&x<b);

function resetWorld(){
  Object.assign(P,{x:120,y:elev(120),vx:0,vy:0,ground:true,hold:false,jumpQ:false,charge:1,glide:false,phase:0,lastFoot:0});
  Object.assign(R,{x:P.x+260,y:P.y-240});bridge.p=0;bridge.done=false;sat=satTarget=.12;glow=0;
  camX=P.x-V.W*.28;camY=P.y-V.H*.7;parts=[];feet=[];
  const c1=['gc','tt','gc','rd','gs','tt','tc','rt','gs','gc','rt','tt','rd','tc'],h1=[20,70,118,40,100,20,128,60,30,110,50,92,20,118];
  const c2=['gs','tc','rt','gc','gd','ts','rc','rs','td','gt','tc','rd','gc','gs','tt','rt'],h2=[40,90,60,110,30,80,50,120,40,95,60,30,110,70,45,100];
  glyphs=[...c1.map((k,i)=>({it:G(k),x:430+i*160,h:h1[i],ch:1,alive:true,ph:Math.random()*6})),

  setChapter('I','O monólito','agora, sem tocar');setupStage();
  const B=[G('gs'),G('gs'),G('tc'),G('rd'),G('tc'),G('gs'),G('rt'),G('td')];
  el('circle',{cx:200,cy:185,r:150,class:'ring'},svg);txt(70,60,'B');
  shuffle(B).forEach((it,i)=>{glyph(it);place(it.g,95+(i%4)*70,150+Math.floor(i/4)*72)});
  setPrompt('O monólito mostra oito luzes do conjunto <b>B</b>. Qual é <b>|B|</b>?');showUI(true);
  await choose([8,5,4,6],5,'Conte cada forma-cor uma única vez: luzes iguais são o mesmo elemento.');
  setPrompt('<b>|B| = 5</b>. Oito luzes, cinco elementos.');await walkButton();showUI(false);
  stones[0].lit=true;bloom();await sleep(900);
}

/* ================= II · interseção em movimento + Venn ================= */
async function chapter2(){
  await narrate(['Adiante, as luzes dançam no ar.','Agora, só algumas pertencem ao seu caminho.','<span class="f">A: tons quentes</span>','<span class="f">B: formas com pontas</span>','Recolha apenas o que está em <em>A</em> e em <em>B</em> ao mesmo tempo.']);
  let ok=0;const got=[];
  const draw=()=>hud(`<div class="rule">Recolha só A ∩ B: quente <em>e</em> com pontas</div><div class="line">${got.map(it=>icon(it)).join('')}</div><div class="line">no seu caminho: <b>${ok}</b></div>`);
  ctx={onPick:(gl,gy)=>{const it=gl.it,c=COL[it.color];
    if(warm(it)&&sharp(it)){ok++;got.push(it);burst(gl.x,gy,c,18,2.6);chime(5+(ok%6),.9);P.charge=Math.min(1,P.charge+.3);toast(`${describe(it)} está em <b>A ∩ B</b>.`,1600)}
    else{burst(gl.x,gy,'#ffffff',10,3);soft();P.charge=Math.max(0,P.charge-.35);
      toast(`${describe(it)}: ${warm(it)?'é':'não é'} quente e ${sharp(it)?'tem':'não tem'} pontas. ${warm(it)?'Só em <b>A</b>.':sharp(it)?'Só em <b>B</b>.':'Fora dos dois.'}`,2600)}
    draw()}};
  draw();await runUntil(5610);ctx={};
  setChapter('II','Dois círculos','onde mora cada luz?');setupStage();showUI(true);
  const A={x:150,y:172,r:92},Bc={x:250,y:172,r:92},U={x:12,y:22,w:376,h:300};
  el('rect',{x:U.x,y:U.y,width:U.w,height:U.h,rx:26,class:'univ'},svg);txt(34,48,'U','lbl s');
  el('circle',{cx:A.x,cy:A.y,r:A.r,class:'ca'},svg);el('circle',{cx:Bc.x,cy:Bc.y,r:Bc.r,class:'cb'},svg);
  txt(96,300,'A  tons quentes','lbl s');txt(306,300,'B  tem pontas','lbl s');
  const list=shuffle([G('gc'),G('rt'),G('ts'),G('tc'),G('gs'),G('rc'),G('td'),G('gd')]);
  const where=it=>{const a=warm(it),b=sharp(it);return a&&b?'mora em <b>A ∩ B</b>, onde os círculos se tocam':a?'mora só em <b>A</b>':b?'mora só em <b>B</b>':'fica fora dos dois círculos, mas dentro de <b>U</b>'};
  for(const it of list){await new Promise(res=>{
    const g=glyph(it);g.classList.add('drag');g.style.opacity=0;const home={x:200,y:362};place(g,home.x,home.y,1.2);setTimeout(()=>g.style.opacity=1,50);
    setPrompt(`${describe(it)}. Arraste para onde ela pertence.`);let drag=false;
    g.addEventListener('pointerdown',e=>{drag=true;g.setPointerCapture(e.pointerId);g.classList.add('held');initAudio()});
    g.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);place(g,p.x,p.y,1.2)});
    const drop=e=>{if(!drag)return;drag=false;g.classList.remove('held');const p=pt(e);
      const inU=p.x>U.x&&p.x<U.x+U.w&&p.y>U.y&&p.y<U.y+U.h,inA=dist(p,A)<A.r,inB=dist(p,Bc)<Bc.r;
      if(inU&&inA===warm(it)&&inB===sharp(it)){place(g,p.x,p.y,1);g.style.pointerEvents='none';chime(4+(Math.random()*5|0),.9);res()}
      else{soft();place(g,home.x,home.y,1.2);setPrompt(`${describe(it)}: ${warm(it)?'é':'não é'} de tom quente e ${sharp(it)?'tem':'não tem'} pontas. Ela ${where(it)}.`)}};
    g.addEventListener('pointerup',drop);g.addEventListener('pointercancel',drop)})}
  setPrompt('Todas as luzes encontraram seu lugar.');await sleep(1300);showUI(false);
  stones[1].lit=true;bloom();
  await narrate(['O que está em <em>pelo menos um</em> círculo é a união.<br><span class="f">A ∪ B</span>','O que está nos <em>dois ao mesmo tempo</em> é a interseção.<br><span class="f">A ∩ B</span>',
    'Aqui, |A| = 5 e |B| = 5.','Somados, dez. Mas dentro dos círculos há apenas sete luzes.','As três do meio foram contadas duas vezes.']);
}

/* ================= III · deslizar e a ponte ================= */
function spiral(c0,cy0,i,dir){const a=i*2.4,r=11*Math.sqrt(i+.5);return{x:c0+dir*Math.abs(Math.cos(a))*r*.9-dir*4,y:cy0+Math.sin(a)*r*1.25}}
function bridgeRound({a,b,u,start}){return new Promise(res=>{
  setupStage();svg.classList.add('noanim');const cy=170,Rr=88,max=Math.min(a,b);
  const gA=el('g',{class:'mov'},svg),gB=el('g',{class:'mov'},svg);
  el('circle',{cx:0,cy,r:Rr,class:'ca'},gA);el('circle',{cx:0,cy,r:Rr,class:'cb'},gB);
  txt(0,cy-Rr-12,'A','lbl',gA);txt(0,cy-Rr-12,'B','lbl',gB);txt(200,cy+Rr+30,'A ∩ B','lbl s');
  const dA=[...Array(a)].map(()=>el('circle',{r:5.5,class:'dot da',filter:'url(#glow)'},svg));
  const dB=[...Array(b)].map(()=>el('circle',{r:5.5,class:'dot db',filter:'url(#glow)'},svg));
  const lens=(j,k)=>({x:200,y:cy+(j-(k-1)/2)*19});
  controls.innerHTML='';const s=document.createElement('input');s.type='range';s.min=0;s.max=max;s.step=1;s.value=start;s.setAttribute('aria-label','Aproximar os círculos');
  controls.appendChild(s);const nb=document.createElement('div');nb.style.width='100%';controls.appendChild(nb);let solved=false;
  function upd(k){const d=k===0?192:172-k*9,xA=200-d/2,xB=200+d/2;
    gA.style.transform=`translate(${xA}px,0)`;gB.style.transform=`translate(${xB}px,0)`;
    dA.forEach((c,i)=>{const p=i<a-k?spiral(xA-36,cy,i,-1):lens(i-(a-k),k);c.style.transform=`translate(${p.x}px,${p.y}px)`});
    dB.forEach((c,i)=>{const p=i<b-k?spiral(xB+36,cy,i,1):lens(i-(b-k),k);c.style.transform=`translate(${p.x}px,${p.y}px)`});
    const sum=a+b-k;setPrompt(`<span class="eq">|A| + |B| − |A ∩ B| = ${a} + ${b} − <b>${k}</b> = <b>${sum}</b></span><span class="goal">a ponte pede |A ∪ B| = ${u}</span>`);
    if(sum===u&&!solved){solved=true;cascade();nb.innerHTML='';const w=document.createElement('button');w.className='walk';w.textContent='firmar a ponte';w.style.marginTop='6px';
      w.onclick=()=>{controls.innerHTML='';svg.classList.remove('noanim');res()};nb.appendChild(w)}
    else if(sum!==u&&solved){solved=false;nb.innerHTML=''}}
  s.oninput=()=>{upd(+s.value);chime(2+ +s.value,.35)};upd(start);requestAnimationFrame(()=>requestAnimationFrame(()=>svg.classList.remove('noanim')))})}
async function chapter3(){
  await narrate(['O chão começa a descer.','Não lute contra a areia.','Deixe-se deslizar.']);
  hud('<div class="rule">Deslize pela duna</div><div class="line">recolha luzes brancas para planar mais longe</div>');
  await runUntil(CHASM[0]-50);
  await narrate(['Um abismo.','Para cruzá-lo, a ponte precisa ter exatamente o tamanho certo.','<span class="f">|A ∪ B| = |A| + |B| − |A ∩ B|</span>']);
  setChapter('III','A ponte','o que é contado duas vezes');showUI(true);
  const rounds=[{a:7,b:5,u:9,start:0,s:'o que é contado duas vezes'},{a:6,b:6,u:8,start:0,s:'de novo, com outras luzes'},{a:4,b:5,u:9,start:4,s:'e se nada for compartilhado?'}];
  for(const r of rounds){$('#subtitle').textContent=r.s;await bridgeRound(r);bridge.p=Math.min(.99,bridge.p+.33);chime(7,.7)}
  setupStage();$('#subtitle').textContent='a última tábua';
  txt(200,140,'|A| = 10','num');txt(200,172,'|B| = 8','num');txt(200,204,'|A ∩ B| = 6','num');txt(200,256,'|A ∪ B| = ?','lbl');
  setPrompt('Quantos elementos há na união?');
  await choose([18,12,24,4],12,'Some |A| e |B|, depois retire o que foi contado duas vezes: a interseção.');
  setPrompt('<b>10 + 8 − 6 = 12</b>');await walkButton('atravessar');showUI(false);
  bridge.p=1;bridge.done=true;bloom();
  await narrate(['Quando nada é compartilhado, a interseção é vazia.','<span class="f">A ∩ B = ∅</span>','E a união é simplesmente a soma.']);
}

/* ================= IV · subida com vento e ecos ================= */
async function chapter4(){
  await narrate(['O caminho sobe para o cume.','O vento sopra forte aqui. No ar, segure: ele te ergue.','E há ecos de quem passou antes.']);
  hud('<div class="rule">Escute os ecos dos viajantes</div><div class="line">cada eco guarda um número</div>');
  await runUntil(10020);
  await narrate(['Quantos viveram ao menos uma das três coisas?','<span class="f">A areia</span> <span class="f">V vento</span> <span class="f">E estrela</span>']);
  setChapter('IV','Três luzes','cada lugar, uma única vez');setupStage();showUI(true);
  const C=[{x:150,y:148,c:'ca',n:'A',lx:62,ly:62,t:'areia'},{x:250,y:148,c:'cb',n:'V',lx:338,ly:62,t:'vento'},{x:200,y:235,c:'cc',n:'E',lx:200,ly:372,t:'estrela'}];
  C.forEach(o=>{el('circle',{cx:o.x,cy:o.y,r:90,class:o.c},svg);txt(o.lx,o.ly,`${o.n}  ${o.t}`,'lbl s')});
  const pos={1:[108,118],2:[292,118],4:[200,300],3:[200,104],5:[146,214],6:[254,214],7:[200,180]},badges={};
  for(const m in pos){const g=el('g',{class:'badge zero'},svg);el('circle',{cx:pos[m][0],cy:pos[m][1],r:15},g);const t=el('text',{x:pos[m][0],y:pos[m][1]},g);t.textContent='×0';badges[m]={g,t}}
  const terms=[{m:1,s:1,l:'|A|',v:15},{m:2,s:1,l:'|V|',v:12},{m:4,s:1,l:'|E|',v:10},{m:3,s:-1,l:'|A∩V|',v:5},{m:6,s:-1,l:'|V∩E|',v:4},{m:5,s:-1,l:'|A∩E|',v:3},{m:7,s:1,l:'|A∩V∩E|',v:2}];
  controls.innerHTML='';
  await new Promise(res=>{
    function upd(){let all=true;
      for(const m in pos){let k=0;terms.forEach(t=>{if(t.on&&(m&t.m)===t.m)k+=t.s});const b=badges[m];b.t.textContent='×'+k;
        b.g.setAttribute('class','badge '+(k===1?'ok':k===0?'zero':k<0?'neg':'over'));if(k!==1)all=false}
      const on=terms.filter(t=>t.on);let sum=0,ex='';on.forEach((t,i)=>{sum+=t.s*t.v;ex+=(i===0?(t.s<0?'−':''):(t.s<0?' − ':' + '))+t.v});
      setPrompt(on.length?`<span class="eq">${ex} = <b>${sum}</b></span><span class="goal">${all?'cada região, contada uma única vez':'cada número mostra quantas vezes a região está sendo contada'}</span>`
        :'Toque nos termos para somá-los ou subtraí-los. Faça cada região ser contada <b>exatamente uma vez</b>.');return all}
    terms.forEach(t=>{const b=document.createElement('button');b.className='term';b.innerHTML=`${t.s>0?'+':'−'} ${t.l}<small>${t.v}</small>`;
      b.onclick=()=>{t.on=!t.on;b.classList.toggle('on',t.on);chime(t.s>0?6:3,.6);if(upd()){controls.querySelectorAll('button').forEach(x=>x.disabled=true);cascade();setTimeout(res,2200)}};controls.appendChild(b)});
    upd()});
  showUI(false);
  await narrate(['Somar os três conta o meio vezes demais.','Subtrair os pares retira demais.','Devolver o centro equilibra tudo.','<span class="f">|A ∪ V ∪ E| = 27</span>',
    'Isso é o princípio da inclusão e exclusão:<br><em>incluir, excluir, incluir de novo,</em><br>até que cada coisa seja contada uma única vez.']);
  setupStage();setChapter('IV','O santuário','o que ficou de fora');showUI(true);
  el('rect',{x:30,y:60,width:340,height:240,rx:28,class:'univ'},svg);txt(56,90,'U','lbl s');
  el('circle',{cx:200,cy:180,r:85,class:'ring'},svg);txt(200,186,'A ∪ V ∪ E','lbl');txt(200,330,'|U| = 30','num');
  setPrompt('Trinta viajantes cruzaram o deserto. Quantos não viveram nenhuma das três coisas?');
  await choose([3,27,0,57],3,'Tudo o que não está na união fica no resto de U: 30 menos a união.');
  setPrompt('<b>30 − 27 = 3</b>. O complemento também é um conjunto.');await walkButton('entrar na luz');showUI(false);
  stones[2].lit=true;satTarget=1;bloom();
}

/* ================= jornada ================= */
async function journey(){
  showUI(false);hud('');resetWorld();mode='pause';
  await narrate(['<h1>Travessia</h1>','<em>uma jornada pelos conjuntos</em>','<small>toque para pular, segure para planar</small>'],{title:true,btn:'começar'});
  await narrate(['O deserto perdeu suas cores.','Elas estão guardadas nas luzes do caminho.','Siga a montanha.']);
  await chapter1();await chapter2();await chapter3();await chapter4();
  mode='ascend';whoosh(1,400,2.5);await sleep(5200);
  await narrate(['Você chegou ao alto.','<span class="f">|A| conta o que é distinto</span>','<span class="f">A ∩ B guarda o que é comum</span>','<span class="f">A ∪ B reúne sem repetir</span>',
    'Contar bem é não esquecer ninguém,<br>e não contar ninguém duas vezes.'],{btn:'recomeçar a travessia'});
  journey();
}
resize();resetWorld();requestAnimationFrame(frame);journey();
