<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo Escuro Estilo Pixel/RPG com Borda Dourada -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#140d1f" stroke="#ffce54" stroke-width="3.5"/>
  <rect x="6" y="6" width="52" height="52" rx="8" fill="none" stroke="#382e56" stroke-width="1.5"/>

  <!-- Círculo Conjunto A (Dourado) -->
  <circle cx="24" cy="26" r="14.5" fill="#ffce54" fill-opacity="0.28" stroke="#ffce54" stroke-width="3.2"/>

  <!-- Círculo Conjunto B (Ciano / Verde-Água) -->
  <circle cx="40" cy="26" r="14.5" fill="#48dbfb" fill-opacity="0.28" stroke="#48dbfb" stroke-width="3.2"/>

  <!-- Círculo Conjunto C (Rosa) -->
  <circle cx="32" cy="39" r="14.5" fill="#ff6b8b" fill-opacity="0.28" stroke="#ff6b8b" stroke-width="3.2"/>

  <!-- Cristal / Estrela na Interseção Central (A ∩ B ∩ C) -->
  <path d="M 32 23 L 34.6 28.4 L 40 31 L 34.6 33.6 L 32 39 L 29.4 33.6 L 24 31 L 29.4 28.4 Z"
        fill="#fff8e7" stroke="#140d1f" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
